<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>群岛 · ARCHIPELAGO</title>
<meta name="description" content="OASIS 团队的 3D 作品群岛：7 座小岛、可上岸自由行走、坐船跨岛，单页零依赖、打开即玩。">
<link rel="canonical" href="https://lubiny0601-spec.github.io/oasis-archipelago/">

<meta property="og:title" content="群岛 · ARCHIPELAGO">
<meta property="og:description" content="OASIS 团队的 3D 作品群岛：7 座小岛、可上岸自由行走、坐船跨岛。">
<meta property="og:url" content="https://lubiny0601-spec.github.io/oasis-archipelago/">

<style>
:root{color-scheme:light;--ink:#16302a;--line:rgba(22,48,42,.13);--paper:rgba(255,255,255,.9);--deep:#16443c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#a8dcf0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;
  background:linear-gradient(180deg,#a8dcf0 0%,#c4e8f4 34%,#d9f1f6 62%,#eaf8f8 100%)}
.stage.night{background:linear-gradient(180deg,#0b1533 0%,#132249 26%,#1d3159 52%,#2c4670 78%,#3d5a86 100%)}
.veil{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .7s}
.veil-night{background:
  radial-gradient(22% 30% at 78% 11%, rgba(206,226,255,.13) 0%, rgba(200,220,255,.045) 46%, rgba(200,220,255,0) 74%),
  linear-gradient(180deg, rgba(10,20,46,0) 0%, rgba(10,20,46,.10) 46%, rgba(9,18,42,.26) 76%, rgba(7,15,36,.40) 100%)}
.stage.night .veil{opacity:1}
.nightsky{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .9s;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 15%,rgba(0,0,0,.62) 24%,rgba(0,0,0,0) 31%);
  mask-image:linear-gradient(180deg,#000 0%,#000 15%,rgba(0,0,0,.62) 24%,rgba(0,0,0,0) 31%)}
.stage.night .nightsky{opacity:1}
#stars{position:absolute;inset:0;width:100%;height:100%;display:block}
.moon{position:absolute;right:14%;top:8%;width:clamp(46px,6.4vw,78px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #fffdf4 0%, #f6f2dd 46%, #e2e1c9 78%, #cfd3bd 100%);
  box-shadow:0 0 22px 7px rgba(232,240,255,.50), 0 0 66px 28px rgba(176,204,255,.22),
    0 0 112px 42px rgba(132,168,240,.10)}
.moon::after{content:'';position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:
    radial-gradient(circle at 63% 27%, rgba(150,158,140,.28) 0 8%, rgba(150,158,140,0) 9%),
    radial-gradient(circle at 38% 60%, rgba(150,158,140,.22) 0 12%, rgba(150,158,140,0) 13%),
    radial-gradient(circle at 72% 68%, rgba(150,158,140,.18) 0 6%, rgba(150,158,140,0) 7%)}
/* ACES 的副作用是中间调去饱和，低模风格靠色块说话，掉了饱和就发灰。
   所以在合成这一层补回来 —— 比在 3D 里逐个材质调色省事，也不会被光照破坏。
   夜景单独一套：夜里本来就要低饱和，只需要把对比拉起来，暖灯才跳得出来。 */
.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;z-index:1}
.haze{display:none;position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg, rgba(210,239,250,.62) 0%, rgba(206,236,247,.30) 17%,
    rgba(200,232,245,.08) 31%, rgba(200,232,245,0) 44%)}
.stage.night .haze{display:none}
@media (max-aspect-ratio: 3/4){ .haze{display:block} }

/* ---- 岛名标签：跟着投影走，否则七座岛不知道该点哪座 ---- */
.labels{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;
  font-size:11px;font-weight:700;letter-spacing:.5px;color:#123a34;
  background:rgba(255,255,255,.80);border:1px solid rgba(20,60,54,.10);
  padding:3.5px 10px;border-radius:999px;backdrop-filter:blur(6px);
  box-shadow:0 2px 9px rgba(16,60,60,.13);opacity:0;transition:opacity .28s}
.lab.on{opacity:1}
.stage.night .lab{background:rgba(18,30,54,.74);color:#cfdcf4;border-color:rgba(140,180,255,.20);
  box-shadow:0 2px 10px rgba(2,8,22,.45)}
.lab b{font-weight:800}
.lab i{font-style:normal;opacity:.46;margin-left:5px;font-size:10px}

.float{position:absolute;z-index:4}
.brand{left:0;top:0;padding:calc(15px + env(safe-area-inset-top)) 18px 14px;pointer-events:none}
.brand .k{font-size:10.5px;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.94);text-shadow:0 1px 3px rgba(16,60,72,.45)}
.brand h1{margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:.5px;color:#fff;line-height:1.15;
  text-shadow:0 1px 5px rgba(16,60,72,.48)}
.stage.night .brand .k{color:rgba(206,224,255,.92);text-shadow:0 1px 4px rgba(4,10,26,.85)}
.stage.night .brand h1{color:#f2f7ff;text-shadow:0 1px 10px rgba(6,14,32,.80), 0 0 24px rgba(120,158,240,.25)}

.bar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  padding:0 12px calc(13px + env(safe-area-inset-bottom));transition:opacity .3s}
.app.sheet-open .bar{opacity:0;pointer-events:none}
.snap .sheet,.snap .bar,.snap .hint,.snap .nightsky,.snap .veil,.snap .lab{transition:none!important}
.bar button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;backdrop-filter:blur(10px);
  box-shadow:0 2px 10px rgba(20,70,70,.12);transition:transform .12s,background .18s,color .18s,border-color .18s}
.bar button:active{transform:scale(.95)}
.bar button:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.bar button.on{background:var(--deep);color:#fff;border-color:var(--deep);box-shadow:0 3px 14px rgba(22,68,60,.28)}
.bar button.act{background:rgba(255,255,255,.86);color:#2c4c42;font-weight:600}
.stage.night ~ .bar button{background:rgba(24,40,68,.80);color:#dbe8fb;border-color:rgba(140,180,255,.20)}
.stage.night ~ .bar button.on{background:#2f6fd0;border-color:#2f6fd0;color:#fff}

.hint{left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));font-size:11.5px;font-weight:600;
  color:#eaf6f2;background:rgba(17,44,38,.66);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);
  padding:7px 14px;border-radius:999px;pointer-events:none;z-index:4;transition:opacity .8s}
.hint b{color:#9ee6c8;font-weight:800}
.err{inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:13px;
  color:#a32d2d;background:rgba(255,255,255,.95);z-index:8}

/* 自由走：虚拟摇杆（触屏）/ 键盘提示。只在漫游态显示。
   bottom 要抬到底栏（按钮 ≈55px + 安全区）之上，否则手机上被按钮压住 */
#joy{position:fixed;left:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:104px;height:104px;border-radius:50%;
  background:rgba(20,48,42,.32);border:1.5px solid rgba(255,255,255,.30);backdrop-filter:blur(3px);
  display:none;z-index:40;touch-action:none;-webkit-user-select:none;user-select:none}
#joy.on{display:block}
#joyKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.62);box-shadow:0 2px 12px rgba(10,30,25,.30);
  transform:translate(-50%,-50%);pointer-events:none;transition:transform .06s linear}
#joy.active #joyKnob{transition:none;background:rgba(255,255,255,.86)}
@media (pointer:fine){ #joy{opacity:.55} }   /* 桌面端即便误显示也弱化 */

/* 自由走：屏幕方向键。桌面端兜底 —— 预览面板/iframe 里键盘可能拿不到焦点，
   有了它鼠标按住就能走；触屏设备已有摇杆，不显示这套。 */
#dpad{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:132px;height:132px;z-index:40;
  display:none;grid-template-areas:'. u .' 'l . r' '. d .';grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:5px}
#dpad.on{display:grid}
#dpad button{margin:0;padding:0;border-radius:12px;border:1.5px solid rgba(255,255,255,.30);background:rgba(20,48,42,.32);
  color:#eaf6f2;font-size:15px;font-weight:700;backdrop-filter:blur(3px);touch-action:none;cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#dpad button.on,#dpad button:active{background:rgba(255,255,255,.62);color:#14302a;border-color:rgba(255,255,255,.55)}
@media (pointer:fine){ #dpad{opacity:.62} }

/* 漫游第③步：乘船条。走到码头根部弹出，选一座岛出发。
   桌面端抬到底栏之上；手机端再抬到摇杆上方（见媒体查询），避免与摇杆叠 */
.voy{position:absolute;left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom));z-index:5;
  display:flex;justify-content:center;align-items:center;gap:8px;pointer-events:none;
  opacity:0;transition:opacity .4s}
.voy.on{opacity:1;pointer-events:auto}
.voy-t{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#eaf6f2;letter-spacing:.05em;
  background:rgba(17,44,38,.66);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);
  padding:6px 11px;border-radius:999px}
#voyChips{display:flex;gap:6px;max-width:70vw;overflow-x:auto;padding:2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 8px,#000 calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 8px,#000 calc(100% - 16px),transparent 100%)}
#voyChips::-webkit-scrollbar{display:none}
#voyChips button{flex:0 0 auto;margin:0;font-size:11px;font-weight:700;color:#eaf6f2;cursor:pointer;
  background:rgba(20,48,42,.55);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);
  padding:6px 12px;border-radius:999px;-webkit-tap-highlight-color:transparent}
#voyChips button:active{background:rgba(255,255,255,.72);color:#14302a}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:center;
  padding:0 10px calc(10px + env(safe-area-inset-bottom));
  transform:translateY(calc(100% + 24px));transition:transform .46s cubic-bezier(.22,.9,.24,1);
  pointer-events:none}
.sheet.on{transform:translateY(0);pointer-events:auto}
.sheet-in{position:relative;width:100%;max-width:430px;max-height:62vh;overflow:auto;overscroll-behavior:contain;
  background:rgba(252,255,253,.965);border:1px solid rgba(22,48,42,.10);border-radius:22px;
  padding:16px 17px 15px;box-shadow:0 -10px 40px rgba(10,44,38,.22), 0 1px 0 rgba(255,255,255,.7) inset;
  backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25)}
.sheet .row{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-right:38px}
.sheet .tag{font-size:10px;font-weight:800;letter-spacing:1.3px;color:#1d6b57;background:rgba(45,160,124,.13);
  border:1px solid rgba(45,160,124,.20);padding:3px 8px;border-radius:999px}
.sheet .idx{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:1px;color:rgba(22,48,42,.38)}
.sheet h2{margin:0;font-size:20px;line-height:1.25;font-weight:800;letter-spacing:.3px;color:#14332c}
.sheet .sub{margin:5px 0 0;font-size:12.5px;font-weight:600;color:#3f7266;line-height:1.5}
.sheet .desc{margin:10px 0 0;font-size:12.5px;line-height:1.66;color:#2f4c45}
.sheet ul{margin:11px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.sheet li{position:relative;padding-left:14px;font-size:11.8px;line-height:1.5;color:#3d5c54}
.sheet li::before{content:'';position:absolute;left:2px;top:6.4px;width:4px;height:4px;border-radius:50%;background:#4bab8a}
.sheet .x{position:absolute;right:11px;top:11px;width:30px;height:30px;border-radius:50%;border:0;padding:0;
  background:rgba(22,48,42,.06);color:#3a5c52;font-size:17px;line-height:1;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .16s,transform .12s}
.sheet .x:active{transform:scale(.9)}
.stage.night .sheet .sheet-in{background:rgba(18,28,49,.93);border-color:rgba(150,186,255,.16);
  box-shadow:0 -10px 40px rgba(2,8,22,.55), 0 1px 0 rgba(170,200,255,.10) inset}
.stage.night .sheet h2{color:#eaf3ff}
.stage.night .sheet .sub{color:#9dc0f0}
.stage.night .sheet .desc{color:#c3d4ec}
.stage.night .sheet li{color:#b3c6e2}
.stage.night .sheet .tag{color:#9fe6c4;background:rgba(80,200,160,.13);border-color:rgba(80,200,160,.22)}
.stage.night .sheet li::before{background:#5fd6a8}
.stage.night .sheet .idx{color:rgba(200,220,250,.42)}
.stage.night .sheet .x{background:rgba(190,215,255,.10);color:#cfe0f8}

@media (max-width:620px){
  .brand h1{font-size:19px}
  .bar button{min-height:42px;padding:0 13px;font-size:12px}
  .bar{gap:6px}
  .lab{font-size:10px;padding:3px 8px}
  /* 手机：乘船条抬到摇杆上方，且比摇杆窄，保证两者不打架 */
  .voy{bottom:calc(194px + env(safe-area-inset-bottom));gap:6px}
  #voyChips{max-width:62vw}
  #voyChips button{font-size:10.5px;padding:5px 10px}
}
/* 作品卡展开时，摇杆/方向键/乘船条都收起，别压在卡片上 */
.app.sheet-open #joy, .app.sheet-open #dpad, .app.sheet-open .voy{opacity:0;pointer-events:none}
/* 手机横屏：屏幕矮，乘船条贴回底栏上方（摇杆在最左侧，横向不冲突） */
@media (max-height:520px) and (max-width:900px){
  .voy{bottom:calc(72px + env(safe-area-inset-bottom))}
  .voy-t{padding:5px 9px}
}
@media (max-aspect-ratio: 3/4){
  .brand .k{color:#1b4a54;text-shadow:none}
  .brand h1{color:#12362f;text-shadow:none}
  .stage.night .brand .k{color:rgba(206,224,255,.92)}
  .stage.night .brand h1{color:#f2f7ff}
}

/* ---- 海报模式 ?hero=1：只留画面，UI 全收掉（错误提示保留，便于排查） ---- */
html.hero .brand, html.hero .hint, html.hero .bar,
html.hero .labels, html.hero .sheet, html.hero #joy,
html.hero #dpad, html.hero #voy{display:none!important}
html.hero .stage{cursor:default}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <div class="haze"></div>
    <div class="veil veil-night"></div>
    <div class="nightsky" id="nightsky">
      <canvas id="stars"></canvas>
      <div class="moon"></div>
    </div>
    <div class="labels" id="labels"></div>
    <div class="float brand"><div class="k" id="bK">ARCHIPELAGO · 07 ISLES</div><h1 id="bH">群岛</h1></div>
    <div class="float hint" id="hint"><b>拖动</b>转 · <b>点岛</b>上岸 · <b>双指</b>缩放</div>
    <div id="joy"><div id="joyKnob"></div></div>
    <div id="dpad">
      <button type="button" data-k="w" style="grid-area:u" aria-label="前进">▲</button>
      <button type="button" data-k="a" style="grid-area:l" aria-label="左移">◀</button>
      <button type="button" data-k="s" style="grid-area:d" aria-label="后退">▼</button>
      <button type="button" data-k="d" style="grid-area:r" aria-label="右移">▶</button>
    </div>
    <div id="voy" class="voy"><span class="voy-t">乘船去</span><div id="voyChips"></div></div>
    <div class="float err" id="err"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-in">
        <button class="x" id="sheetX" aria-label="关闭">×</button>
        <div class="row"><span class="tag" id="sTag"></span><span class="idx" id="sIdx"></span></div>
        <h2 id="sTitle"></h2>
        <p class="sub" id="sSub"></p>
        <p class="desc" id="sDesc"></p>
        <ul id="sList"></ul>
      </div>
    </div>
  </div>
  <div class="bar">
    <button id="back" class="act" hidden>← 群岛</button>
    <button id="spin" class="on">自动旋转</button>
    <button id="light">夜晚</button>
    <button id="reset" class="act">重置视角</button>
  </div>
</div>

<script src="./three.min.js"></script>
<script>
(function(){
'use strict';

/* ============ DOM ============ */
var stage  = document.getElementById('stage');
var hintEl = document.getElementById('hint');
var errEl  = document.getElementById('err');
var sheet  = document.getElementById('sheet');
var appEl  = document.querySelector('.app');
var sTag   = document.getElementById('sTag');
var sIdx   = document.getElementById('sIdx');
var sTitle = document.getElementById('sTitle');
var sSub   = document.getElementById('sSub');
var sDesc  = document.getElementById('sDesc');
var sList  = document.getElementById('sList');
var labelsEl = document.getElementById('labels');
var bK = document.getElementById('bK'), bH = document.getElementById('bH');
var backBtn = document.getElementById('back');
var starsCv = document.getElementById('stars');
var starsCtx = starsCv.getContext('2d');

/* ---- 海报模式 ?hero=1 ---- */
var HERO = /[?&]hero=1/.test(location.search);
function qNum(k, d){
  var m = location.search.match(new RegExp('[?&]' + k + '=(-?[0-9.]+)'));
  return m ? parseFloat(m[1]) : d;
}

window.addEventListener('error', function(ev){
  errEl.style.display = 'flex';
  errEl.textContent = '渲染出错：' + (ev.message || '未知');
});

/* ============ 随机与几何工具 ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var TAU = Math.PI*2;

var _q = new THREE.Quaternion(), _e = new THREE.Euler(), _pv = new THREE.Vector3(), _ps = new THREE.Vector3();
function M(x,y,z,rx,ry,rz,s){
  var m = new THREE.Matrix4();
  _e.set(rx||0, ry||0, rz||0);
  _q.setFromEuler(_e);
  var sc = (s===undefined)?1:s;
  m.compose(_pv.set(x,y,z), _q, _ps.set(sc,sc,sc));
  return m;
}
function mergeParts(parts){
  var pos=[], nor=[], col=[], c=new THREE.Color();
  for(var k=0;k<parts.length;k++){
    var p = parts[k];
    var g = p.g.clone();
    if(p.m) g.applyMatrix4(p.m);
    if(g.index) g = g.toNonIndexed();
    var pa = g.attributes.position.array, na = g.attributes.normal ? g.attributes.normal.array : null;
    if(!na){ g.computeVertexNormals(); na = g.attributes.normal.array; }
    c.set(p.c); c.convertSRGBToLinear();
    for(var i=0;i<pa.length;i+=3){
      pos.push(pa[i],pa[i+1],pa[i+2]);
      nor.push(na[i],na[i+1],na[i+2]);
      col.push(c.r,c.g,c.b);
    }
    g.dispose();
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col,3));
  return geo;

          m:MAl(x0+d.x*len*0.5, y0+d.y*len*0.5, z0+d.z*len*0.5, d.x,d.y,d.z), c:col};
}
/* 树冠体块：不规则 ico 球 + 垂直压扁。压扁才有「篷」的感觉，正球永远是气球 */
function lobe(rad, x,y,z, sy, amp, seed, ry){
  var m = new THREE.Matrix4();
  _e.set(0, ry||0, 0);
  _q.setFromEuler(_e);
  m.compose(_pv.set(x,y,z), _q, _ps.set(1, sy===undefined?0.92:sy, 1));
  return {g:blobGeo(rad, 1, amp===undefined?0.20:amp, seed||1), m:m};
}

function geoBroad(seed){
  var r = mulberry32(seed);
  var wood = [], crown = [];
  /* 干冠比是树的「骨架感」所在：上一版 h≈0.075 / 冠宽 0.20，
     就成了球压在地上。这一版把干拉到 0.10+、冠收到 0.16 宽，
     比例从 1:2.6 变成 1:1.6，才像树而不像蘑菇。 */
  var h = 0.100 + r()*0.022;
  var lx = (r()-0.5)*0.008;                         // 轻微歪斜，不站成一排电线杆
  var tl = (r()-0.5)*0.09;
  wood.push({g:new THREE.CylinderGeometry(0.0105,0.0175,h,6), m:M(lx,h*0.5,0, 0,0,tl), c:'#8a6144'});
  /* 根部外扩：低模树最容易漏的一笔，没有它树干看着像插在草地上的一根棍。
     倾斜角必须和树干一致，否则树干一歪，这个底盘就从侧面戳出来一块。 */
  wood.push({g:new THREE.CylinderGeometry(0.0175,0.0245,0.013,6), m:M(lx*0.15,0.0065,0, 0,0,tl), c:'#7a5539'});
  /* 三根斜枝撑住树冠：这是树的「骨骼」，没有它就只剩棒棒糖 */
  for(var b=0;b<3;b++){
    var ba = b/3*Math.PI*2 + r()*0.7;
    wood.push(limb(lx*0.8, h*0.80, 0, Math.cos(ba), 0.95, Math.sin(ba),
                   0.036 + r()*0.016, 0.0072, 0.0038, '#7d573c'));
  }
  var R1 = 0.078 + r()*0.013;
  var y1 = h + 0.004 + R1*0.84;                     // 冠底刚好落在树干顶上
  var ra = r()*TAU;
  /* 轮廓要「下宽上尖」：主冠在中部偏下最宽，靠上面的两级凸起收口。
     体块之间保持 70% 以上的半径重叠 —— 低模树的轮廓只允许鼓包，
     一旦出现凹槽或「两个球叠起来」的接缝，就从树变成了雪人。 */
  crown.push(lobe(R1, 0, y1, 0, 0.84, 0.16, seed+7, 0));
  crown.push(lobe(R1*0.80, Math.cos(ra)*R1*0.20, y1 + R1*0.50, Math.sin(ra)*R1*0.20,
                  0.90, 0.17, seed+23, 0));
  var a3 = ra + 2.4;
  crown.push(lobe(R1*0.56, Math.cos(a3)*R1*0.24, y1 + R1*0.94, Math.sin(a3)*R1*0.24,
                  0.96, 0.18, seed+41, 0));
  return concatGeo([mergeParts(wood), faceShade(mergeParts(crown), FOL_D, FOL_M, FOL_L, 0.44, -0.30)]);
}

function geoPine(seed){

  var tiers = [

  return concatGeo([mergeParts(wood), faceShade(mergeParts(crown), PIN_D, PIN_M, PIN_L, 0.20, -0.18)]);
}

function geoCherry(seed){
  var r = mulberry32(seed);
  var wood = [], crown = [];
  var h = 0.112 + r()*0.020;                        // 樱是「低矮宽伞」，干要显眼
  wood.push({g:new THREE.CylinderGeometry(0.0112,0.0190,h,6), m:M(0,h*0.5,0, 0,0,(r()-0.5)*0.10), c:'#8c6047'});
  wood.push({g:new THREE.CylinderGeometry(0.0190,0.0295,0.012,6), m:M(0,0.006,0), c:'#7c523d'});
  /* 四根外张斜枝把伞面撑开 —— 樱花冠下那圈放射状枝干是它最好认的特征 */
  var R1 = 0.082 + r()*0.012;
  var rot0 = r()*TAU;
  for(var b=0;b<4;b++){
    var ba = rot0 + b/4*TAU;
    wood.push(limb(0, h*0.82, 0, Math.cos(ba), 0.58, Math.sin(ba),
                   0.058 + r()*0.012, 0.0078, 0.0036, '#875b42'));
  }
  var cy = h + 0.042;
  /* 樱冠 = 扁盘 + 大半径圆顶。
     上一版是「扁盘 + 小鼓包」，鼓包太小，它的斜侧面被分到中间色阶、
     盘顶被分到亮色阶，渲染出来就是一个假坑（几何上并没有凹，是色阶骗人）。
     现在顶冠半径给到 0.82R、底部深埋进盘里，高度从中心到边缘单调下降，
     既是伞形又不会出现台阶。 */
  crown.push(lobe(R1, 0, cy, 0, 0.55, 0.14, seed+5, 0));
  for(var i=0;i<2;i++){
    var a2 = rot0 + 0.5 + i*3.1;
    crown.push(lobe(R1*0.60, Math.cos(a2)*R1*0.62, cy + R1*0.02, Math.sin(a2)*R1*0.62,
                    0.50, 0.15, seed+31+i*9, 0));
  }
  crown.push(lobe(R1*0.82, 0, cy + R1*0.34, 0, 0.62, 0.15, seed+77, 0));
  return concatGeo([mergeParts(wood), faceShade(mergeParts(crown), CHR_D, CHR_M, CHR_L, 0.44, -0.30)]);
}

/* 棕榈叶：一条连续拱起的扁带，不是两截对拼的棍子。
   之前的写法「上扬段 + 下垂段」两段各自定角，接缝处一个硬折角，
   宽度又在整段里线性收到零 → 渲染出来是一把匕首/爪尖。
   现在拆成 N 段走一条仰角从 +e0 渐变到 -e1 的弧，
   宽度前 60% 基本不变、后 40% 才收尖，才是椰叶的形状。 */
var _bU = new THREE.Vector3(), _bS = new THREE.Vector3(), _bN = new THREE.Vector3();
function blade(x0,y0,z0, dx,dy,dz, len, halfW0, halfW1, col, flat){
  _bU.set(dx,dy,dz);
  if(_bU.lengthSq() < 1e-9) _bU.set(0,1,0);
  _bU.normalize();
  _bS.set(-_bU.z, 0, _bU.x);
  if(_bS.lengthSq() < 1e-6) _bS.set(1,0,0);
  _bS.normalize();
  _bN.crossVectors(_bS, _bU).normalize();
  var m = new THREE.Matrix4().makeBasis(_bS, _bU, _bN);
  m.multiply(new THREE.Matrix4().makeScale(1, 1, flat===undefined?0.30:flat));
  m.setPosition(x0+_bU.x*len*0.5, y0+_bU.y*len*0.5, z0+_bU.z*len*0.5);
  /* openEnded：段与段之间的端盖必须去掉。留着的话，后一段比前一段细，
     前一段的端盖就露出一圈环——渲染出来是叶片上横着一道黑线。 */
  return {g:new THREE.CylinderGeometry(halfW1, halfW0, len, 4, 1, true), m:m, c:col};
}
function frondChain(out, x0,y0,z0, ax,az, len, segs, e0, e1, w0, colMid, colTip){
  var px = x0, py = y0, pz = z0;
  function wAt(f){
    if(f < 0.62) return w0*(1 - 0.12*(f/0.62));
    return w0*0.88*Math.max(0, 1 - (f-0.62)/0.38);
  }
  for(var s=0;s<segs;s++){
    var f0 = s/segs, f1 = (s+1)/segs;
    /* 仰角用 f^1.8 而不是线性：叶片要「先挺住、后急坠」才像椰叶；
       线性插值出来是一条斜直线，远看是把扇子不是叶 */
    var e  = e0 + (e1-e0)*Math.pow(f0, 1.8);
    var nm = Math.sqrt(1 + e*e);
    var ux = ax/nm, uy = e/nm, uz = az/nm;
    var sl = len/segs;
    /* 每段画长 18%：相邻段的截面朝向不同，接缝处会露出楔形缝，
       让它们互相插进去，缝就没了 */
    out.push(blade(px, py, pz, ux, uy, uz, sl*1.18, wAt(f0), wAt(f1), (f0 < 0.5 ? colMid : colTip), 0.28));
    px += ux*sl; py += uy*sl; pz += uz*sl;
  }
}

function geoPalm(seed){
  var r = mulberry32(seed);
  var wood = [], crown = [];
  var h1 = 0.168 + r()*0.034;              // 椰树要「高瘦」：冠幅不能超过干高
  var lean = 0.20 + r()*0.14;              // 梢部越往上越歪
  /* 三段树干，每段起点严格接上一段终点 —— 上一版两段各摆各的，
     中间直接断成两截，远看像一截树桩旁边飘着一丛叶。 */
  var segs = [
    {dir:0.06, len:h1*0.50, r0:0.0180, r1:0.0132},
    {dir:lean*0.45, len:h1*0.30, r0:0.0132, r1:0.0108},
    {dir:lean, len:h1*0.22, r0:0.0108, r1:0.0094}
  ];
  var px = 0, py = 0;
  for(var k=0;k<segs.length;k++){
    var sg = segs[k];
    var nm = Math.sqrt(sg.dir*sg.dir + 1);
    var ux = sg.dir/nm, uy = 1/nm;
    wood.push(limb(px, py, 0, ux, uy, 0, sg.len, sg.r0, sg.r1, k===0?'#a07548':'#966b41', 6));
    px += ux*sg.len; py += uy*sg.len;
  }
  /* 冠心球：没有它，六片叶是「从一点炸开」的星芒；有了它，
     叶丛是从一个果核里长出来的 */
  crown.push({g:icoG(0.0155, 1), m:M(px, py, 0), c:PLM_M});
  /* 叶片：一条连续拱起的扁带（4 段） */
  var NF = 7;
  for(var i=0;i<NF;i++){
    var a = i/NF*TAU + r()*0.34;
    frondChain(crown, px, py, 0, Math.cos(a), Math.sin(a),
               0.132 + r()*0.022, 4, 0.72 + r()*0.16, -1.35 - r()*0.20,
               0.0128, (i%2? PLM_M : PLM_L), PLM_L);
  }
  /* 内层短叶：从冠心往上翘，补出叶丛的厚度 */
  for(var j=0;j<3;j++){
    var b2 = j/3*TAU + 1.0;
    frondChain(crown, px, py + 0.010, 0, Math.cos(b2), Math.sin(b2),
               0.054, 2, 1.20, 0.45, 0.0105, PLM_M, PLM_L);
  }
  // 椰果
  crown.push({g:icoG(0.0135, 0), m:M(px, py - 0.012, 0.012), c:'#6b4a2c'});
  crown.push({g:icoG(0.0125, 0), m:M(px + 0.014, py - 0.014, -0.011), c:'#5e4024'});
  return concatGeo([mergeParts(wood), faceShade(mergeParts(crown), PLM_D, PLM_M, PLM_L, 0.22, -0.16)]);
}

function geoBush(seed){
  var r = mulberry32(seed);

  var n = 3 + Math.floor(r()*2);
  for(var i=0;i<n;i++){

    var a = i/n*TAU + r()*0.7;
    var d = (i===0) ? 0 : 0.030 + r()*0.012;        // 偏移压小，灌木要连成一体
    parts.push(lobe(s, Math.cos(a)*d, s*0.80 + r()*0.012, Math.sin(a)*d, 0.82, 0.24, seed+i*13, r()*3));
  }
  return faceShade(mergeParts(parts), BSH_D, BSH_M, BSH_L, 0.44, -0.28);
}

/* 岩块：低模石头要「有棱角 + 不规则」。
   原来两颗正十二面体随机转一下就撒下去，出来是一片鹅卵石 / 圆疙瘩。
   现在：多面体顶点按位置哈希扰动 → 棱角出来；y 压扁 → 石头是「躺着」的；
   再把最低点归零 → 底座正好坐在地上，不用靠手调 y 去猜埋多深。
   另外孤石最假，一律「一主两碎」成组。 */
function rockChunk(rad, seed, sq){
  var g = jitterGeo(new THREE.DodecahedronGeometry(rad, 0), 0.36, seed);
  var a = g.attributes.position.array;
  for(var i=1;i<a.length;i+=3) a[i] *= sq;          // 压扁
  var minY = 1e9;
  for(var j=1;j<a.length;j+=3) if(a[j] < minY) minY = a[j];
  for(var k=1;k<a.length;k+=3) a[k] -= minY;        // 底座落到 y=0
  g.attributes.position.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}
function geoRock(seed){
  var r = mulberry32(seed);
  var parts = [];
  var main = 0.024 + r()*0.013;
  /* 整体下沉 0.008：石头的底面是平的，地面有坡 —— 不下沉的话
     上坡侧埋进去、下坡侧翘起来，整块石头看着是"浮"在草上的 */
  parts.push({g:rockChunk(main, seed, 0.62 + r()*0.16),
              m:M(0,-0.008,0, 0, r()*TAU, 0), c:'#b4b1a3'});
  for(var i=0;i<2;i++){
    var a = r()*TAU, d = main*(0.80 + r()*0.45);
    var rad = main*(0.34 + r()*0.26);
    parts.push({g:rockChunk(rad, seed + i*137, 0.58 + r()*0.20),
                m:M(Math.cos(a)*d, -0.005, Math.sin(a)*d, 0, r()*TAU, 0), c:'#a9a698'});
  }
  /* 石头三档：冷灰偏一点绿，和沙子的暖米色拉开距离，不然石堆会糊进沙滩 */
  return faceShade(mergeParts(parts), '#767569', '#98968a', '#c0beb0', 0.46, -0.28);
}

function geoGate(){
  var parts = [
    {g:new THREE.BoxGeometry(0.026,0.098,0.026), m:M(-0.040,0.049,0), c:'#cfd2d4'},

/* ============ 岛形 ============ */
var NA = 152;
function angDiff(a,b){var d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function bump(a,c,w){var d=angDiff(a,c);return Math.exp(-(d*d)/(2*w*w));}

/* 轮廓不是硬编码的：低频谐波搭出大瓣，再挖湾、推半岛。
   低频为主是关键 —— 高次谐波会把海岸线打成锯齿，失掉手绘感 */
function makeShape(seed, sx, sz){
  var r = mulberry32(seed);
  var H = [], f = 2 + Math.floor(r()*2);
  for(var k=0;k<6;k++){
    H.push({f:f, a:(0.108/(1+k*1.15))*(0.60+r()*0.80), p:r()*TAU});
    f += 1 + Math.floor(r()*2);
  }
  var bays=[], nb = 1+Math.floor(r()*2);
  for(var b=0;b<nb;b++) bays.push({a:r()*TAU, w:0.13+r()*0.10, d:0.10+r()*0.10});
  var caps=[], nc = 1+Math.floor(r()*2);
  for(var c0=0;c0<nc;c0++) caps.push({a:r()*TAU, w:0.13+r()*0.12, d:0.10+r()*0.13});

  function raw(a){
    var v=1;
    for(var k2=0;k2<H.length;k2++) v += H[k2].a*Math.sin(H[k2].f*a+H[k2].p);
    for(var b2=0;b2<bays.length;b2++) v -= bays[b2].d*bump(a,bays[b2].a,bays[b2].w);
    for(var c2=0;c2<caps.length;c2++) v += caps[c2].d*bump(a,caps[c2].a,caps[c2].w);
    return v;
  }
  var tab = new Float32Array(NA);
  for(var i=0;i<NA;i++) tab[i]=raw(i/NA*TAU);
  var t2 = tab.slice();                       // 只磨一遍：两遍会把半岛和内湾一起抹平
  for(var i2=0;i2<NA;i2++) tab[i2] = t2[i2]*0.46 + t2[(i2-1+NA)%NA]*0.27 + t2[(i2+1)%NA]*0.27;
  return {tab:tab, sx:sx, sz:sz, seed:seed};
}
function Rat(shape, a){
  var n=((a%TAU)+TAU)%TAU;
  var f=n/TAU*NA, i=Math.floor(f), fr=f-i;
  return shape.tab[i%NA]*(1-fr)+shape.tab[(i+1)%NA]*fr;
}

/* 剖面：平顶草地 + 窄金边沙滩 + 陡崖收底。所有岛共用这套剖面，
   差异交给轮廓、尺寸、山头和植被去表达 */
var PROF = [
  {rf:0.000,y: 0.0050},{rf:0.340,y: 0.0046},{rf:0.620,y: 0.0042},{rf:0.820,y: 0.0036},
  {rf:0.892,y: 0.0028},{rf:0.922,y:-0.004},{rf:0.946,y:-0.018},{rf:0.966,y:-0.040},
  {rf:0.980,y:-0.066},{rf:0.990,y:-0.102},{rf:0.999,y:-0.148},{rf:1.009,y:-0.208},
  {rf:1.016,y:-0.286},{rf:1.015,y:-0.366},{rf:1.005,y:-0.446},{rf:0.985,y:-0.524},
  {rf:0.953,y:-0.598},{rf:0.907,y:-0.670},{rf:0.843,y:-0.740},{rf:0.761,y:-0.806},
  {rf:0.661,y:-0.864},{rf:0.541,y:-0.914},{rf:0.401,y:-0.952},{rf:0.241,y:-0.980},
  {rf:0.100,y:-0.995},{rf:0.000,y:-1.000}
];
var TOP_N = 12;   // PROF[0..12] 是「岛心 → 外缘」，之后是侧壁
/* P0 地基二：草地段径向加密
   原来 rf 0~0.892（占岛面积八成）只有 5 个环，而 buildLand 里那几层
   顶点色噪声（sin(px*2.6) 到 sin(px*21.5)）的波长比环间距还小，
   插值时被直接抹平 —— 地面于是呈纯色平涂，残留的低频还变成放射状条纹。
   这里按 0.03 步长重采草地段，环数 5 → 30，噪声才采得出来。 */
(function(){
  var step = 0.030, base = 4, out = [];
  for(var i=0;i<base;i++){
    var A = PROF[i], B = PROF[i+1];
    var n = Math.max(1, Math.round((B.rf-A.rf)/step));
    out.push(A);
    for(var k=1;k<n;k++){
      var t = k/n;
      out.push({rf:A.rf+(B.rf-A.rf)*t, y:A.y+(B.y-A.y)*t});
    }
  }
  for(var j=base;j<PROF.length;j++) out.push(PROF[j]);
  PROF.length = 0;
  for(var m=0;m<out.length;m++) PROF.push(out[m]);
  TOP_N = 0;                                  // 外缘改成按 rf 峰值动态定位，不再写死索引
  for(var q=1;q<PROF.length;q++) if(PROF[q].rf > PROF[TOP_N].rf) TOP_N = q;
})();
var LAND_STOPS = [
  /* 水下：冷灰岩。原来整条剖面都是米色渐变，岛的侧壁读作「巧克力蛋糕」 */
  [-1.000,'#4e4b44'],[-0.860,'#575349'],[-0.740,'#615c50'],[-0.640,'#6b6558'],
  [-0.550,'#756e5f'],[-0.470,'#7f7767'],[-0.400,'#8a8170'],[-0.340,'#9a8e79'],
  /* 水线以上仍要留沙滩（不然岛就没有"岸"了），但水线那一档明显加深 ——
     沙滩和水的交界需要一条「湿沙」暗边，否则岛是「淡出」在水里的 */
  [-0.300,'#bda887'],[-0.265,'#d9c6a0'],[-0.230,'#e9d6ae'],[-0.195,'#f2e0b6'],
  [-0.158,'#f6e6bb'],[-0.115,'#f7e8bd'],
  [-0.092,'#ebe0a4'],[-0.076,'#c8cf84'],[-0.062,'#a2bd5c'],[-0.044,'#8ecb55'],
  [-0.024,'#82bf50'],[-0.008,'#89c755'],[ 0.000,'#91cd5c'],[ 0.006,'#9bd468']
];
var WATER_Y = -0.300;

function profTopY(rf){
  if(rf <= 0) return PROF[0].y;
  for(var i=0;i<TOP_N;i++){
    if(rf <= PROF[i+1].rf){
      var f = (rf-PROF[i].rf)/(PROF[i+1].rf-PROF[i].rf);
      return PROF[i].y + (PROF[i+1].y-PROF[i].y)*f;
    }
  }
  return PROF[TOP_N].y;
}
/* 山头：只抬岛心附近，边缘不动，所以海岸线完全不受影响 */
function hillAt(rf, cfg){
  if(!cfg.hill) return 0;
  var k = rf/0.62;
  if(k >= 1) return 0;
  return cfg.hill * Math.pow(Math.cos(k*Math.PI*0.5), 1.6);
}
/* 地表高度：剖面 + 岛心山头 + 局部土丘 + 草地微起伏。
   hillAt 是径向对称的 —— 七座岛中心长出来都是同一个「圆馒头」，
   所以另加 blob（岛内任意位置的小土丘），岛才有地形而不是一块平台。 */
function landY(u, v, rf, cfg){
  var y = profTopY(rf) + hillAt(rf, cfg);
  if(cfg.blob && rf < 0.90){
    /* 土丘靠近海岸必须收掉，否则会顶到沙滩、把海岸线拱变形 */
    var fade = rf > 0.78 ? Math.max(0, (0.90-rf)/0.12) : 1;
    fade = fade*fade*(3-2*fade);
    for(var i=0;i<cfg.blob.length;i++){
      var b = cfg.blob[i];
      var dx = u-b.u, dz = v-b.v;
      var d2 = (dx*dx+dz*dz)/(b.r*b.r);
      if(d2 < 1){ var k = 1-d2; y += b.h*k*k*fade; }
    }
  }
  /* 草地微起伏：波长 0.38~0.41，环距 0.03 —— 每波长 13 个采样。
     第一版用 k≈25（波长 0.245，只有 8 个采样），flatShading 下每条波峰
     只剩两三个三角形宽，渲染出来是地面上的斜向"灯芯绒"，不是地形。 */
  if(rf < 0.86){
    var relief = Math.sin(u*13.0 + v*8.0)*0.0085 + Math.sin(u*6.5 - v*15.0)*0.0060;
    y += relief * (rf > 0.60 ? (0.86-rf)/0.26 : 1);
  }
  return y;
}
function topY(shape, cfg, x, z){
  var u = x/shape.sx, v = z/shape.sz;
  var rf = Math.sqrt(u*u+v*v)/Rat(shape, Math.atan2(v,u));
  if(rf > 0.900) return null;              // 只往草地上摆，沙滩留给礁石
  return landY(u, v, rf, cfg);
}

/* ============ 地形网格 ============ */
function buildLand(shape, cfg){
  var M2 = PROF.length;
  var pos=[], col=[], idx=[];
  var c = new THREE.Color(), tint = new THREE.Color();
  var nz = mulberry32(cfg.seed*7+13);
  var gset = cfg.grass || 1;      // 草地明度：>1 偏亮，<1 偏深
  var gt = cfg.grassTint || [1,1,1];   // 草地色偏：光调亮度做不出气候差异，得真的换色
  /* 岸线过渡：沙滩与草地的分界不再是一刀切 */
  var SAND_C = new THREE.Color('#f4e2ab'), GRASS_C = new THREE.Color('#6fb04a');
  var SAND_HI = -0.118, GRASS_LO = -0.032;   // 沙→草过渡带的高度区间

  for(var i=0;i<NA;i++){
    var a = i/NA*TAU;
    var R0 = shape.tab[i];
    for(var m=0;m<M2;m++){
      var pr = PROF[m];
      var r = R0*pr.rf;
      var y = pr.y;
      /* 高度抖动要极小：地形是 flatShading，逐顶点随机高度会让每个三角面的
         法线各偏几度，光照差 3~5%，而极坐标网格的三角形又细又长，
         投影到屏幕上就是那片从岛心放射出去的扇形条纹。
         起伏现在全部交给 landY 里的低频正弦（波长 9 倍于环距），
         这里只留一点几乎看不见的碎屑，破掉「完全光滑」的感觉。 */
      if(pr.rf < 0.90)
        y = landY(Math.cos(a)*r, Math.sin(a)*r, pr.rf, cfg)
          + (nz()-0.5)*0.0004*(1-pr.rf/0.90);
      var px = Math.cos(a)*r*shape.sx, pz = Math.sin(a)*r*shape.sz;
      pos.push(px, y, pz);
      /* 草地不按高度取色：LAND_STOPS 在 y≈0 那一段色阶极陡（0.006 内就跨两档），
         而顶点高度本身带 ±0.001 的随机抖，一查表就被放大成色阶跳变 ——
         相邻环因此出现明暗差，透视压缩后就是那片摩尔纹条纹。
         草地用固定基色，所有明暗变化交给下面那段平滑噪声。 */
      /* 沙滩 → 草地做平滑过渡：原来 y>-0.045 一把跳成草色，海岸线上就是一条
         剃刀般的分界（也是上一轮「草地纯色平涂」的观感来源之一）。
         现在在 SAND_HI~GRASS_LO 之间用 smoothstep 混色，草线自然散开成一段
         半沙半草的滩涂；再往下才交给 LAND_STOPS 的湿沙/水线色阶。 */
      if(y > SAND_HI){
        var tg = (y - SAND_HI)/(GRASS_LO - SAND_HI);
        tg = tg<0?0:(tg>1?1:tg);
        tg = tg*tg*(3-2*tg);
        c.copy(SAND_C).lerp(GRASS_C, tg);
      } else c.copy(grad(LAND_STOPS, y));
      if(y > SAND_HI){
        /* 频率要配得上网格尺度：加密后径向环距约 0.038，
           21.5 那档波长只有 0.29，每波长不到 8 个采样，直接摩尔纹成条纹。
           砍掉最高频，把幅度让给低频 —— 出来的才是「草皮色块」而不是「斑马纹」 */
        var blot = Math.sin(px*2.6+pz*1.9)*0.100
                 + Math.sin(px*6.3)*Math.cos(pz*5.1)*0.098
                 + Math.sin(px*11.3+pz*7.4)*0.030
                 + (nz()-0.5)*0.012;
        if(pr.rf > 0.72) blot -= (pr.rf-0.72)/0.22 * 0.10;
        /* 噪声与明度只按「草的比例」生效：沙滩保持干净的原色，
           否则过渡带里会糊出一层脏斑，反而比硬切更难看 */
        var t = 1 + (blot + (gset-1))*tg;
        tint.setRGB(t*gt[0], t*gt[1], t*gt[2]);
        c.multiply(tint);
      }
      c.convertSRGBToLinear();
      col.push(c.r,c.g,c.b);
    }
  }
  for(var i2=0;i2<NA;i2++){
    var i3 = (i2+1)%NA;
    for(var m2=0;m2<M2-1;m2++){
      var A = i2*M2+m2, B = i3*M2+m2, C = i2*M2+m2+1, D = i3*M2+m2+1;
      idx.push(A,B,C, B,D,C);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  var mat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.95, metalness:0, flatShading:true});
  var mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

/* ============ 散布：同几何合成 InstancedMesh ============
   单岛版每棵树都是独立 mesh，七座岛照搬会有两千多个 drawcall。
   这里按几何分桶，一桶一个 InstancedMesh，七座岛压在两百以内 */
function makeInstances(geo, items, mat){
  if(!items.length) return null;
  var im = new THREE.InstancedMesh(geo, mat || PAINT, items.length);
  var m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(),
      v = new THREE.Vector3(), sv = new THREE.Vector3();
  for(var i=0;i<items.length;i++){
    e.set(0, items[i].rot, 0); q.setFromEuler(e);
    v.set(items[i].x, items[i].y, items[i].z);
    sv.setScalar(items[i].s);
    m4.compose(v, q, sv);
    im.setMatrixAt(i, m4);
  }
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true; im.receiveShadow = true;
  im.frustumCulled = false;
  return im;
}

var GEO = {
  pine:   [geoPine(404), geoPine(717)],
  broad:  [geoBroad(101), geoBroad(202), geoBroad(303), geoBroad(404), geoBroad(505)],
  cherry: [geoCherry(505), geoCherry(606)],
  palm:   [geoPalm(707), geoPalm(808)],
  bush:   [geoBush(909), geoBush(111)],
  flower: [geoFlowerClump(121), geoFlowerClump(131), geoFlowerClump(141)],
  grass:  [geoGrassTuft(151), geoGrassTuft(161)],
  rock:   [geoRock(171)],
  // 石板：铺成一条小径，岛才有「有人住」的痕迹
  tile:   [geoStoneTile(11), geoStoneTile(22), geoStoneTile(33)],
  // 中层物件：路灯、长椅、栅栏。原版岛耐看的关键是这些，不是树多
  lamp:   [geoLamp()],
  bench:  [geoBench()],
  fence:  [geoFence()],
  column: [geoColumn()],
  sign:   [geoSign()]
};
/* 石板单独一个材质：几何里的顶点色是烘死的（接近白），
   不换材质就是一串白点铺在草地上，整座岛都被它抢掉 */
var MAT_TILE = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.97, metalness:0,
  flatShading:true, color:0x8b8474});
var MAT_BY_KIND = {tile: MAT_TILE};

var LANDMARK_GEO = {
  windmill:  geoWindmill(),
  gate:      geoGate(),
  torii:     geoTorii(),
  houseBlue: geoHouseBlue(),
  houseWood: geoHouseWood(),
  pavilion:  geoPavilion(),
  lookout:   geoLookout(),
  bench:     geoBench(),
  sign:      geoSign(),
  lamp:      geoLamp(),
  column:    geoColumn(),
  bridge:    geoBridge(),
  fence:     geoFence()
};

/* 每座岛的气质由这张配比表决定：松多的森严、樱多的绚烂、石多的荒芜 */
var TREE_MESHES = [];                    // 只给 ?noveg=1 用
function scatterIsle(shape, cfg, grp, rnd){
  var buckets = {};
  for(var k2 in GEO){
    buckets[k2] = [];
    for(var j=0;j<GEO[k2].length;j++) buckets[k2].push([]);
  }
  var shadows = [], placed = [];
  /* 树在整体尺度上要「大而密」：总览是第一眼，冠幅不够就显秃。
     尺寸和间距分开缩放（间距只跟 0.90 档），否则树一变大就被挤稀。 */
  var TREE_SC = 1.02;

  function freeAt(x, z, rad){
    for(var i=0;i<placed.length;i++){
      var p = placed[i];
      var dx = x-p.x, dz = z-p.z;
      if(dx*dx+dz*dz < (rad+p.r)*(rad+p.r)) return false;
    }
    return true;
  }
  function occupy(x,z,r){ placed.push({x:x,z:z,r:r}); }

  function put(kind, x, z, s, opt){
    opt = opt || {};
    var y = topY(shape, cfg, x, z);
    if(y === null) return false;
    var rad = (opt.gap || 0.05);
    if(!freeAt(x, z, rad*0.85)) return false;
    var gi = Math.floor(rnd()*buckets[kind].length);
    buckets[kind][gi].push({x:x, y:y, z:z, rot:(opt.rot !== undefined ? opt.rot : rnd()*TAU), s:s});
    occupy(x, z, rad);
    if((opt.hh||0.10)*s >= 0.18) shadows.push({x:x, z:z, r:(opt.sr||0.030)*s, h:(opt.hh||0.10)*s});
    return true;
  }

  function randIn(minR, maxR){
    for(var t=0;t<120;t++){
      var a = rnd()*TAU;
      var uv = Math.sqrt(minR*minR + rnd()*(maxR*maxR-minR*minR));
      if(uv > Rat(shape,a)*0.895) continue;
      return {x:Math.cos(a)*uv*shape.sx, z:Math.sin(a)*uv*shape.sz};
    }
    return null;
  }

  /* ---- 先铺石板小径：从地标通向岛缘 ----
     路是最便宜也最有效的「人味」：它把散落的物件串成一个场所 */
  var lx = cfg.landmark.u*shape.sx, lz = cfg.landmark.v*shape.sz;
  var pa = cfg.pathAngle !== undefined ? cfg.pathAngle : rnd()*TAU;
  var edgeR = Rat(shape, pa);
  var ex = Math.cos(pa)*edgeR*0.845*shape.sx, ez = Math.sin(pa)*edgeR*0.845*shape.sz;
  var PN = 26;
  for(var pi=0; pi<PN; pi++){
    var f = pi/(PN-1);
    var bend = Math.sin(f*Math.PI)*0.20;
    var px = lx + (ex-lx)*f - Math.sin(pa)*bend;
    var pz = lz + (ez-lz)*f + Math.cos(pa)*bend;
    // 两头收窄：路口散几块、近地标铺密一点，像被人踩出来的
    if(pi > 1 && pi < PN-1 && rnd() < 0.14) continue;
    var ty = topY(shape, cfg, px, pz);
    if(ty === null) continue;
    var ti = Math.floor(rnd()*buckets.tile.length);
    buckets.tile[ti].push({x:px, y:ty+0.001, z:pz, rot:rnd()*TAU, s:1.25+rnd()*0.40});
    occupy(px, pz, 0.026);
  }

  /* ---- 中层物件沿路摆：路灯 + 长椅 + 木牌 ----
     这些不占地标的位置，但决定了岛「像不像有人住」 */
  var pathPts = [];
  for(var pp=0; pp<5; pp++){
    var pf = 0.18 + pp*0.16;
    pathPts.push({x: lx + (ex-lx)*pf - Math.sin(pa)*Math.sin(pf*Math.PI)*0.20,
                  z: lz + (ez-lz)*pf + Math.cos(pa)*Math.sin(pf*Math.PI)*0.20});
  }
  // 路灯：路边两盏，错开左右
  for(var li=0; li<2; li++){
    var base = pathPts[li*2+1];
    if(!base) continue;
    var side = (li%2 ? 1 : -1)*0.070;
    put('lamp', base.x + Math.cos(pa)*side, base.z + Math.sin(pa)*side, 2.30,
        {gap:0.030, sr:0.020, hh:0.13});
  }
  // 长椅：朝岛心坐
  var bpt = pathPts[2];
  if(bpt) put('bench', bpt.x - Math.cos(pa)*0.095, bpt.z - Math.sin(pa)*0.095, 2.10,
              {gap:0.042, sr:0.034, hh:0.06, rot:pa+Math.PI});
  // 木牌：路口处，指示方向
  put('sign', ex*0.94, ez*0.94, 2.20, {gap:0.034, sr:0.022, hh:0.11, rot:pa+2.2});

  /* ---- 林心：树聚成几片林子，中间留大片空草坪 ----
     均匀撒点是最容易让岛变「假」的做法 */
  var GROVES = [];
  var nG = cfg.groves || 3;
  for(var gi2=0; gi2<nG; gi2++){
    for(var tr=0; tr<26; tr++){
      var gp = randIn(0.16, 0.72);
      if(!gp) continue;
      var okg = true;
      for(var q=0;q<GROVES.length;q++){
        var ddx = gp.x-GROVES[q].x, ddz = gp.z-GROVES[q].z;
        if(ddx*ddx+ddz*ddz < 0.40*0.40){ okg = false; break; }
      }
      if(!okg) continue;
      GROVES.push({x:gp.x, z:gp.z, r:0.24 + rnd()*0.22});
      break;
    }
  }
  function inGrove(x, z){
    for(var i=0;i<GROVES.length;i++){
      var g = GROVES[i];
      var dx = x-g.x, dz = z-g.z;
      if(dx*dx+dz*dz < g.r*g.r) return g;
    }
    return null;
  }
  // 岩堆：石头也要成片，散着放像撒芝麻
  var DUNES = [];
  for(var di=0; di<2; di++){
    var dp = randIn(0.22, 0.78);
    if(dp) DUNES.push({x:dp.x, z:dp.z, r:0.18+rnd()*0.18});
  }
  function inDune(x, z){
    for(var i=0;i<DUNES.length;i++){
      var g = DUNES[i];
      var dx = x-g.x, dz = z-g.z;
      if(dx*dx+dz*dz < g.r*g.r) return true;
    }
    return false;
  }

  var V = cfg.veg;
  var plan = [
    {k:'pine',   n:V.pine,   gap:0.105, sr:0.086, s:[0.94,1.34], minR:0.18, maxR:0.84, hh:0.30},
    {k:'broad',  n:V.broad,  gap:0.112, sr:0.100, s:[0.88,1.32], minR:0.16, maxR:0.84, hh:0.28},
    {k:'cherry', n:V.cherry, gap:0.110, sr:0.096, s:[0.94,1.22], minR:0.16, maxR:0.84, hh:0.26},
    {k:'palm',   n:V.palm,   gap:0.128, sr:0.072, s:[0.90,1.18], minR:0.42, maxR:0.86, hh:0.28},
    {k:'bush',   n:V.bush,   gap:0.082, sr:0.046, s:[0.90,1.35], minR:0.04, maxR:0.92, hh:0.14},
    {k:'flower', n:V.flower, gap:0.034, sr:0.020, s:[0.95,1.40], minR:0.04, maxR:0.93, hh:0.05},
    {k:'grass',  n:V.grass,  gap:0.028, sr:0.014, s:[0.95,1.40], minR:0.03, maxR:0.94, hh:0.04},
    {k:'rock',   n:V.rock,   gap:0.052, sr:0.030, s:[0.95,1.40], minR:0.10, maxR:0.94, hh:0.06}
  ];
  var isTree = {pine:1, broad:1, cherry:1, palm:1};

  for(var i=0;i<plan.length;i++){
    var pl = plan[i];
    var made = 0, tries = 0;
    while(made < pl.n && tries < pl.n*90){
      tries++;
      var pos = null;
      if(isTree[pl.k] && GROVES.length && rnd() < 0.88){
        // 从某个林心附近长出来
        var gv = GROVES[Math.floor(rnd()*GROVES.length)];
        var ga = rnd()*TAU, gr = Math.sqrt(rnd())*gv.r;
        pos = {x: gv.x + Math.cos(ga)*gr, z: gv.z + Math.sin(ga)*gr};
      } else if(pl.k === 'rock' && DUNES.length && rnd() < 0.8){
        var du = DUNES[Math.floor(rnd()*DUNES.length)];
        var da = rnd()*TAU, dr = Math.sqrt(rnd())*du.r;
        pos = {x: du.x + Math.cos(da)*dr, z: du.z + Math.sin(da)*dr};
      } else {
        pos = randIn(pl.minR, pl.maxR);
      }
      if(!pos) continue;
      // 林心外的树稀一点：林子边缘自然过渡，不是硬切的圆
      var s = pl.s[0] + rnd()*(pl.s[1]-pl.s[0]);
      var gp2 = pl.gap;
      var popt = {gap:gp2, sr:pl.sr, hh:pl.hh};
      if(isTree[pl.k]){
        s *= TREE_SC; gp2 *= TREE_SC*0.90; popt.gap = gp2;
        /* 树的顶点色是烘死的（亮面固定朝主光侧），实例再随机旋转，
           就会出现「亮面朝左的树」和「亮面朝右的树」混在一起 ——
           整片林子发脏的真正原因。树是没有正反的体块，直接不转；
           几何本身的顶点扰动已经保证了每棵都不一样。 */
        popt.rot = 0;
      }
      if(put(pl.k, pos.x, pos.z, s, popt)) made++;
    }
  }

  // 沙滩边的礁石：贴岛缘一圈，把陆地和水分开
  var edgeN = 0;
  for(var e=0;e<200 && edgeN<12;e++){
    var ea = rnd()*TAU;
    var euv = Rat(shape, ea)*(0.855 + rnd()*0.05);
    var eex = Math.cos(ea)*euv*shape.sx, eez = Math.sin(ea)*euv*shape.sz;
    var y2 = topY(shape, cfg, eex, eez);
    if(y2 === null) continue;
    if(!freeAt(eex, eez, 0.028)) continue;
    var gi3 = Math.floor(rnd()*buckets.rock.length);
    buckets.rock[gi3].push({x:eex, y:y2, z:eez, rot:rnd()*TAU, s:0.95+rnd()*0.5});
    occupy(eex, eez, 0.030);
    shadows.push({x:eex, z:eez, r:0.028, h:0.055});
    edgeN++;
  }

  var meshes = [], detail = [];
  var SMALL = {lamp:1, bench:1, sign:1};   // 这些只有走近才看得清
  for(var bk in buckets){
    for(var bj=0;bj<buckets[bk].length;bj++){
      var im = makeInstances(GEO[bk][bj], buckets[bk][bj], MAT_BY_KIND[bk]);
      if(im){
        grp.add(im);
        meshes.push(im);
        if(SMALL[bk]) detail.push(im);
        /* 树单独记一份：?noveg=1 时整片收掉，方便给小人 / 地标出特写 */
        if(isTree[bk]) TREE_MESHES.push(im);
      }
    }
  }
  return {shadows:shadows, meshes:meshes, detail:detail};
}

/* ============ 假投影：程序化椭圆，叠三层做出柔边 ============ */
function buildShadows(specs, grp, cfg){
  if(!specs.length) return;
  var groundOf = function(x,z){
    var y = topY(cfg.shape, cfg, x, z);
    return y === null ? profTopY(0.88) : y;
  };
  var SEG = 10;
  var c = new THREE.Color('#31474d'); c.convertSRGBToLinear();
  var ang = Math.atan2(SHADOW_DIR.y, SHADOW_DIR.x);
  var ca = Math.cos(ang), sa = Math.sin(ang);
  /* 三层由外到内递深：单一椭圆会读成一块贴纸；层间尺寸差太大又会糊成一片污渍，
     所以外圈只比中圈大 25%，靠不透明度叠出柔边 */
  var LAYERS = [{k:1.00, op:0.26},{k:0.62, op:0.32}];
  for(var L=0;L<LAYERS.length;L++){
    var pos=[], col=[], idx=[], base=0;
    for(var i=0;i<specs.length;i++){
      var sp = specs[i];
      var len = sp.h * SHADOW_LEN;
      var rx = (sp.r + len*0.55) * LAYERS[L].k;
      var rz = (sp.r * 0.98)      * LAYERS[L].k;
      var cx = sp.x + SHADOW_DIR.x * len * 0.46;
      var cz = sp.z + SHADOW_DIR.y * len * 0.46;
      var ly = groundOf(cx, cz) + 0.0042 + L*0.0004;
      pos.push(cx, ly, cz); col.push(c.r,c.g,c.b);
      for(var s2=0;s2<SEG;s2++){
        var a2 = s2/SEG*TAU;
        var lx = Math.cos(a2)*rx, lz = Math.sin(a2)*rz;
        var qx = cx + lx*ca - lz*sa, qz = cz + lx*sa + lz*ca;
        /* 每个环点单独贴地：影子整片躺在一个高度上，遇到坡地就会被地面吃掉半边，
           剩下的残片看起来像一道斜楔子，而不是「影子」。地形起伏 0.01 级就足够毁掉它。 */
        pos.push(qx, groundOf(qx, qz) + 0.0042 + L*0.0004, qz);
        col.push(c.r,c.g,c.b);
      }
      for(var s3=1;s3<=SEG;s3++){
        var nx = (s3===SEG) ? 1 : s3+1;
        idx.push(base, base+nx, base+s3);
      }
      base += SEG+1;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color',    new THREE.Float32BufferAttribute(col,3));
    g.setIndex(idx);
    var m = new THREE.MeshBasicMaterial({vertexColors:true, transparent:true,
      opacity:LAYERS[L].op, depthWrite:false, side:THREE.DoubleSide});
    var mesh = new THREE.Mesh(g, m);
    mesh.renderOrder = 1 + L;
    grp.add(mesh);
  }
}

/* ============ 浪花环带 ============ */
function buildFoam(shape, rf0, rf1, color, op){
  var pos=[], idx=[], N=96, M3=2;
  for(var i=0;i<N;i++){
    var a = i/N*TAU;
    var R0 = Rat(shape, a);
    for(var m=0;m<M3;m++){
      var rf = rf0 + (rf1-rf0)*(m/(M3-1));
      var r = R0*rf;
      var yy = WATER_Y + 0.004 + Math.sin(a*9)*0.0022 + Math.cos(a*5+1)*0.0016;
      pos.push(Math.cos(a)*r*shape.sx, yy, Math.sin(a)*r*shape.sz);
    }
  }
  for(var i2=0;i2<N;i2++){
    var i3=(i2+1)%N;
    for(var m2=0;m2<M3-1;m2++){
      var A=i2*M3+m2,B=i3*M3+m2,C=i2*M3+m2+1,D=i3*M3+m2+1;
      idx.push(A,B,C,B,D,C);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  var mat = new THREE.MeshBasicMaterial({color:color, transparent:true, opacity:op, depthWrite:false});
  return new THREE.Mesh(geo, mat);
}

/* ============ 岛缘浅滩环带 ============ */
function buildShelf(shape){
  var N = 132, M = 9;
  var pos=[], col=[], idx=[];
  var cA = new THREE.Color(), cB = new THREE.Color();
  function sample(f, out){
    for(var k=0;k<SHELF_STOPS.length-1;k++){
      var A = SHELF_STOPS[k], B = SHELF_STOPS[k+1];
      if(f >= A[0] && f <= B[0]){
        var t = (f-A[0])/(B[0]-A[0]);
        cA.set(A[1]); cB.set(B[1]);
        out.c.copy(cA).lerp(cB, t).convertSRGBToLinear();
        out.a = A[2] + (B[2]-A[2])*t;
        return;
      }
    }
    out.c.set(SHELF_STOPS[SHELF_STOPS.length-1][1]).convertSRGBToLinear();
    out.a = 0;
  }
  var tmp = {c:new THREE.Color(), a:0};
  for(var i=0;i<N;i++){
    var a = i/N*TAU;
    var R0 = Rat(shape, a);
    for(var m=0;m<M;m++){
      // 非线性铺开：贴着岛缘的地方落更多层，渐变才不吃紧
      var f = m/(M-1);
      var rf = 1.0 + f*0.50;
      var r = R0*rf;
      var y = WATER_Y + 0.008 + Math.sin(a*7)*0.0016;
      pos.push(Math.cos(a)*r*shape.sx, y, Math.sin(a)*r*shape.sz);
      sample(f, tmp);
      col.push(tmp.c.r, tmp.c.g, tmp.c.b, tmp.a);
    }
  }
  for(var i2=0;i2<N;i2++){
    var i3=(i2+1)%N;
    for(var m2=0;m2<M-1;m2++){
      var A2=i2*M+m2,B2=i3*M+m2,C2=i2*M+m2+1,D2=i3*M+m2+1;
      idx.push(A2,B2,C2,B2,D2,C2);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col,4));
  geo.setIndex(idx);
  var mat = new THREE.MeshBasicMaterial({vertexColors:true, transparent:true,
    depthWrite:false, side:THREE.DoubleSide});
  var mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 2;
  return mesh;
}

/* ============ 海：颜色按「离最近岛缘的距离」算 ============
   不能再用离原点的半径 —— 七座岛各有各的浅滩，统一径向渐变会全错 */
var SEA_STOPS = [
  [0.000,'#2fc4bb'],[0.030,'#1caea9'],[0.080,'#15989e'],[0.180,'#0f8490'],
  [0.360,'#0c7186'],[0.700,'#0b5d78'],[1.400,'#0f5074'],[3.000,'#28688c'],[6.500,'#639cbe']
];
/* 岛缘浅滩：海面一格 0.4 世界单位，比浅滩本身还宽，颜色会被插值糊成一圈光晕。
   所以浅滩单独做成贴岛轮廓的环带网格，精度由环的段数决定，不受网格密度限制 */
var SHELF_STOPS = [
  [0.00, '#7fe3d3', 0.52],
  [0.16, '#33bcb2', 0.40],
  [0.40, '#149ca6', 0.26],
  [0.72, '#10889c', 0.12],
  [1.00, '#0d7088', 0.00]
];
function buildSea(isles){
  var RAD = 30, SEG = 116;
  var geo = new THREE.PlaneGeometry(RAD*2, RAD*2, SEG, SEG);
  geo.rotateX(-Math.PI/2);
  var p = geo.attributes.position;
  var col = new Float32Array(p.count*3);
  var c = new THREE.Color(), nz = mulberry32(4242);
  var n = isles.length;
  for(var i=0;i<p.count;i++){
    var x = p.getX(i), z = p.getZ(i);
    var best = 1e9;
    for(var k=0;k<n;k++){
      var is = isles[k];
      var dx = (x-is.x)/is.shape.sx, dz = (z-is.z)/is.shape.sz;
      var uv = Math.sqrt(dx*dx+dz*dz);
      var Rl = Rat(is.shape, Math.atan2(dz,dx));
      var t = (uv - Rl)/Rl;
      if(t < best) best = t;
    }
    // 浅滩环按岛半径计宽，群岛尺度下会拉成一圈圈白雾；压到 0.6 才收得住
    var tt = best < 0 ? 0 : best*0.52;
    c.copy(grad(SEA_STOPS, tt));
    var k2 = 0.985 + nz()*0.03;
    c.multiplyScalar(k2);
    c.convertSRGBToLinear();
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    p.setY(i, WATER_Y + Math.sin(tt*7.5)*0.004 + Math.cos(x*3.1+z*2.7)*0.003);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.computeVertexNormals();
  /* ---- P3 光与大气 · 海面 ----
     原来海面是一块「按离岸距离上色的哑光板」：颜色只有顶点色，跟视线没关系，
     所以不管从哪个角度看都是同一个青，近处和远处除了雾没有区别 ——
     这是整张图最缺「空气」的地方。
     真实的海是：俯视看到水色，掠射看到天空的镜面反射（菲涅尔），
     所以越远越接近天色。这里就用同一个 skyColor() 采样天空，
     按菲涅尔混进去，再用两层低频 sin 扰动水面法线让反射碎成波光。
     海和天因此共用一套颜色，远处自然连成一片。 */
  var mat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.62, metalness:0.0});
  mat.onBeforeCompile = function(sh){
    sh.uniforms.uTop     = SKY_U.uTop;
    sh.uniforms.uMid     = SKY_U.uMid;
    sh.uniforms.uHor     = SKY_U.uHor;
    sh.uniforms.uGlow    = SKY_U.uGlow;
    sh.uniforms.uGlowAmt = SKY_U.uGlowAmt;
    sh.uniforms.uSunDir  = SKY_U.uSunDir;
    sh.uniforms.uSunAmt  = SKY_U.uSunAmt;
    sh.uniforms.uTime    = SEA_U.uTime;
    sh.uniforms.uRefl    = SEA_U.uRefl;

    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <begin_vertex>',
               '#include <begin_vertex>\n  vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');

    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>',
               '#include <common>\nvarying vec3 vWPos;\nuniform float uTime;\nuniform float uRefl;\n' + SKY_GLSL)
      /* 在 outgoingLight 定稿前（output_fragment 会写进 gl_FragColor）替换 */
      /* 注入点必须用 tonemapping_fragment：这个 three 构建里没有 output_fragment
         这个 chunk（r128 是直接写 gl_FragColor = vec4(outgoingLight, a)），
         所以要在色调映射之前改 gl_FragColor —— 此时它已经是线性的 outgoingLight，
         而 fog 还没叠上来，次序正好。 */
      .replace('#include <tonemapping_fragment>', [
        'vec3 Vw = normalize(cameraPosition - vWPos);',
        /* 海面几何本来就接近水平，法线直接在世界空间合成，不用反算视图空间 */
        'float wv1 = sin(vWPos.x*5.1 + uTime*0.95) * cos(vWPos.z*4.3 - uTime*0.72);',
        'float wv2 = sin((vWPos.x*0.72 + vWPos.z*0.69)*8.3 - uTime*1.35);',
        'float wv3 = cos(vWPos.x*2.7 - vWPos.z*3.1 + uTime*0.45);',
        /* 远处不做细波：掠射角下法线稍微一动，反射方向就大幅摆动，
           叠上天空渐变会放大成一片"磨砂玻璃"大斑。所以扰动幅度要小、
           距离衰减要早 —— 远处的海只剩大尺度的明暗，波纹交给近处。 */
        'float wFar = 1.0 - smoothstep(3.5, 12.0, length(vWPos.xz));',
        'vec3 nW = normalize(vec3((wv1*0.010 + wv2*0.006) * (0.35 + 0.65*wFar), 1.0, (wv2*0.010 - wv3*0.005) * (0.35 + 0.65*wFar)));',
        /* Schlick 菲涅尔：俯视看水色，掠射看天色。指数 3.6 而不是 5 —— 这个机位
           俯角 38°、画面顶部的海面只有 24°，真实值（F≈0.09）在这个尺度上看不出来，
           稍作夸张才能读出"越远越接近天"的纵深 */
        'float ct = clamp(dot(nW, Vw), 0.0, 1.0);',
        'float fres = 0.045 + 0.955 * pow(1.0 - ct, 3.6);',
        'vec3 Rw = reflect(-Vw, nW);',
        'vec3 skyRef = skyColor(normalize(vec3(Rw.x, max(Rw.y, 0.015), Rw.z)));',
        'gl_FragColor.rgb = mix(gl_FragColor.rgb, skyRef, fres * uRefl);',
        '#include <tonemapping_fragment>'
      ].join('\n'));
  };
  var mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  return mesh;
}

/* ============ 圆环标记贴图 ============ */
function makeDotTexture(){
  var cv = document.createElement('canvas'); cv.width = cv.height = 64;
  var c2 = cv.getContext('2d');
  // 深色粗描边 + 白色细环：单放白环压在浅绿草地上等于没画
  c2.strokeStyle = 'rgba(16,40,34,0.30)';
  c2.lineWidth = 10;
  c2.beginPath(); c2.arc(32,32,20,0,TAU); c2.stroke();
  c2.strokeStyle = 'rgba(255,255,255,0.98)';
  c2.lineWidth = 3.6;
  c2.beginPath(); c2.arc(32,32,20,0,TAU); c2.stroke();
  c2.fillStyle = 'rgba(255,255,255,0.96)';
  c2.beginPath(); c2.arc(32,32,3.6,0,TAU); c2.fill();
  return new THREE.CanvasTexture(cv);
}
var DOT_TEX = makeDotTexture();
var DOT_MAT = new THREE.SpriteMaterial({map:DOT_TEX, transparent:true, opacity:0.6,
  depthWrite:false, color:0xfff2d2});
function makeDot(){
  var sp = new THREE.Sprite(DOT_MAT);
  sp.scale.setScalar(0.105);
  sp.renderOrder = 12;
  return sp;
}

/* ============ 建岛 ============ */
var isles = [];          // {cfg, shape, grp, x, z, label, dot, lm}
var allLand = [];        // 用于拾取
var allLm = [];
var archipelago = new THREE.Group();
scene.add(archipelago);

ISLES_CFG.forEach(function(cfg, idx){
  var shape = makeShape(cfg.seed, cfg.sx, cfg.sz);
  cfg.shape = shape;
  var rnd = mulberry32(cfg.seed*31 + 7);

  var grp = new THREE.Group();
  grp.position.set(cfg.x, 0, cfg.z);
  archipelago.add(grp);

  // 地形
  var land = buildLand(shape, cfg);
  land.userData = {isleId: cfg.id};
  grp.add(land);
  allLand.push(land);

  // 地标
  var lmCfg = cfg.landmark;
  var lx = lmCfg.u*shape.sx, lz = lmCfg.v*shape.sz;

  if(ly === null) ly = profTopY(0.4);
  var lm = new THREE.Mesh(LANDMARK_GEO[lmCfg.kind], PAINT);
  lm.position.set(lx, ly, lz);
  lm.rotation.y = lmCfg.rot;
  lm.scale.setScalar(lmCfg.sc);
  lm.castShadow = true; lm.receiveShadow = true;
  lm.userData = {isleId: cfg.id, workId: cfg.id, name: NAME_BY_KIND[lmCfg.kind] || ''};
  grp.add(lm);
  allLm.push(lm);

  // 风车叶片单独转
  if(lmCfg.kind === 'windmill'){
    var blades = new THREE.Mesh(geoWindmillBlades(), PAINT);
    blades.position.set(0, 0.088*1.02, 0.040);
    blades.castShadow = true;

    cfg.blades = blades;
  }
  // 石门里透出的青光
  if(lmCfg.kind === 'gate'){
    var glowMat = new THREE.MeshBasicMaterial({color:0x62d8e8, transparent:true, opacity:0.82, side:THREE.DoubleSide});
    var glow = new THREE.Mesh(new THREE.PlaneGeometry(0.058, 0.074), glowMat);
    glow.position.set(0, 0.048, 0.001);
    lm.add(glow);
    cfg.portalGlow = glowMat;   /* 微动效：石门青光呼吸 */
  }

  // 布景
  var sc = scatterIsle(shape, cfg, grp, rnd);
  cfg.detail = sc.detail;
  var allShadows = sc.shadows.concat([{x:lx, z:lz, r:0.09*lmCfg.sc, h:0.055*lmCfg.sc}]);
  buildShadows(allShadows, grp, cfg);

  // 浅滩 + 潮线
  var shelf = buildShelf(shape);
  grp.add(shelf);
  var foamIn  = buildFoam(shape, 0.985, 1.075, 0xffffff, 0.62);
  var foamOut = buildFoam(shape, 1.085, 1.210, 0xccf6f2, 0.26);

  // 可点击的圆环标记

  // 岛名标签
