  lab.innerHTML = '<b>' + (WORKS[cfg.id] ? WORKS[cfg.id].title : cfg.id) + '</b><i>0' + (idx+1) + '</i>';
  labelsEl.appendChild(lab);

  isles.push({cfg:cfg, shape:shape, grp:grp, x:cfg.x, z:cfg.z, lm:lm, dot:dot, lab:lab,
              foamIn:foamIn, foamOut:foamOut, lx:lx, lz:lz, ly:ly});
});

/* ============ 跨岛航线 + 巡游小船 ============
   动机：好看来自密度和动线，不来自精度。这里只补「动线」，
   不碰岛形、不碰拾取（pick 只认 allLand/allLm）、不加载任何外部资源。
   虚线全部合并成一片几何 → 1 个 drawcall；?noroute=1 可整体关掉做对比。
   流光：每条虚线顶点带 aT（沿线进度），shader 里按 fract(aT*周期 - 时间)
   出「彗尾」亮斑向进港方向游动 —— 死板的等亮虚线就活了；夜里光斑更亮、
   底子更暗，读作一串游向码头的浮标灯。hero/snap 下 uTime 锁死，构图可复现。
   ⚠️ 开关别叫 ?fx= / ?route=：hero 模式已有 fx=(focusX) 机位参数，会撞名。 */
var ROUTE_ON = !/[?&]noroute=1/.test(location.search);
var ROUTE_Y = WATER_Y + 0.014;
var ROUTE_MAT = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, side:THREE.DoubleSide,
  uniforms:{
    uTime:{value:0}, uOp:{value:0.52}, uNight:{value:0},
    uColor:{value:new THREE.Color(0xf0ffff)}
  },
  vertexShader:
    'attribute float aT; varying float vT;'+
    'void main(){ vT=aT; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:
    'uniform float uTime; uniform float uOp; uniform float uNight; uniform vec3 uColor;'+
    'varying float vT;'+
    'void main(){'+
    '  float w = fract(vT*18.0 - uTime*0.10);'+
    '  float comet = smoothstep(0.50, 0.97, w);'+
    '  vec3 col = uColor + vec3(0.28,0.34,0.36)*comet*(0.50 + 0.50*uNight);'+
    '  float a = uOp*(0.74 + 0.26*comet - 0.24*uNight);'+
    '  gl_FragColor = vec4(col, a);'+
    '}'
});
ROUTE_MAT.userData.__tinted = true;   /* 夜色自己管，别被全局 tint 压暗 */
var routeGroup = new THREE.Group(); scene.add(routeGroup);

/* 主航道锚点全在岛间水域；生成后再逐点推离岛缘做保底 */
var ROUTE_ANCHORS = [
  [ 0.00,-2.62],[ 1.30,-2.18],[ 2.32,-0.34],[ 2.04, 1.52],
  [-0.10, 2.46],[-1.58, 2.18],[-2.32, 0.52],[-2.32,-1.36],[-0.86,-2.54]
];
function islandDepth(p, is){
  var dx=(p.x-is.x)/(is.shape.sx*1.16), dz=(p.z-is.z)/(is.shape.sz*1.16);
  return Math.sqrt(dx*dx+dz*dz);
}
var ROUTE = (function(){
  var cps=[], i, k, pass;
  for(i=0;i<ROUTE_ANCHORS.length;i++)
    cps.push(new THREE.Vector3(ROUTE_ANCHORS[i][0]*0.84, ROUTE_Y, ROUTE_ANCHORS[i][1]*0.84));
  var p = new THREE.CatmullRomCurve3(cps, true, 'centripetal').getPoints(288);
  for(pass=0; pass<3; pass++){
    for(i=0;i<p.length;i++){
      for(k=0;k<isles.length;k++){
        var is=isles[k], q=islandDepth(p[i], is);
        if(q<1.02 && q>1e-5){
          var s=1.02/q;
          p[i].x = is.x + (p[i].x-is.x)*s;
          p[i].z = is.z + (p[i].z-is.z)*s;
        }
      }
    }
    var sm=[];
    for(i=0;i<p.length;i++){
      var a=p[(i-1+p.length)%p.length], b=p[i], c=p[(i+1)%p.length];
      sm.push(new THREE.Vector3((a.x+2*b.x+c.x)/4, ROUTE_Y, (a.z+2*b.z+c.z)/4));
    }
    p = sm;
  }
  return p;
})();

/* 六条进港支线：从主航道最近点弯向各岛，碰到岛缘就停
   有支线的岛同时登记进 HARBORS —— 后面按它给每岛配码头 */
var HARBORS = [], SPUR_BY_ID = {};
/* 灯笼位置收集器 → 建真点光源（见 buildPierLamps） */
var LAMP_PTS = [], LAMP_LIGHTS = [], WATER_GLOWS = [];
/* 水面倒影用的加色柔光盘材质（7 个码头共用 1 份）。
   ⚠ 必须定义在码头构建之前 —— 那段是顶层立即执行的 if 块，不是函数，
   放到后面会因为 var 提升拿到 undefined，Three 回退成默认白色材质，
   水面上就出现一块硬边白方块。 */
var WATER_GLOW_MAT = new THREE.ShaderMaterial({
  uniforms:{ uC:{value:new THREE.Color(0xffa95a).convertSRGBToLinear()}, uA:{value:0.0} },
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:'varying vec2 vUv; uniform vec3 uC; uniform float uA;'+
    'void main(){ float d=length(vUv-vec2(0.5))*2.0;'+
    'float a=1.0-smoothstep(0.0,1.0,d); a*=a;'+
    'gl_FragColor=vec4(uC*a*uA, 1.0); }',
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
var SPURS = (function(){
  var out=[];
  for(var k=0;k<isles.length;k++){
    var is=isles[k];
    if(is.cfg.id === 'gate') continue;
    var bi=0, bd=1e9;
    for(var i=0;i<ROUTE.length;i++){
      var d=(ROUTE[i].x-is.x)*(ROUTE[i].x-is.x)+(ROUTE[i].z-is.z)*(ROUTE[i].z-is.z);
      if(d<bd){ bd=d; bi=i; }
    }
    var A=ROUTE[bi], dx=is.x-A.x, dz=is.z-A.z, seg=[];
    var bend=(k%2 ? 1 : -1)*0.12;
    for(var s=0;s<=30;s++){
      var u=s/30, w=Math.sin(Math.PI*u)*bend;
      var p=new THREE.Vector3(A.x+dx*u-dz*w, ROUTE_Y, A.z+dz*u+dx*w);
      if(islandDepth(p, is) < 1.04) break;
      var blocked=false;
      for(var k2=0;k2<isles.length;k2++)
        if(isles[k2]!==is && islandDepth(p, isles[k2])<1.02){ blocked=true; break; }
      if(blocked) break;
      seg.push(p);
    }
    if(seg.length>3){
      out.push(seg);
      SPUR_BY_ID[is.cfg.id] = seg;
      var e2=seg[seg.length-1], ex=e2.x-is.x, ez=e2.z-is.z, el=Math.sqrt(ex*ex+ez*ez)||1;
      HARBORS.push({is:is, ex:ex/el, ez:ez/el, d:el});
    }
  }
  return out;
})();
/* 主岛 gate 不在进港支线里，但「每岛有港口」不能漏：
   用石板路 pathAngle 方向虚拟一个港位，只建码头、不加航线 */
(function(){
  var g=isleById('gate'); if(!g) return;
  var pa=g.cfg.pathAngle||0;
  HARBORS.push({is:g, ex:Math.cos(pa), ez:Math.sin(pa),
                d:Math.max(g.shape.sx,g.shape.sz)*1.02});
})();

/* 虚线：每个小短横 4 顶点 / 2 三角形，全部塞进一个 BufferGeometry
   aT = 该横沿本条航线的进度（0 航道起点 → 1 码头），供流光 shader 用 */
function makeDashMesh(paths){
  var pos=[], att=[], idx=[], n=0, hl=0.027, hw=0.0062;
  for(var k=0;k<paths.length;k++){
    var P=paths[k], step=(k===0 ? 3 : 2);   /* 支线短，虚线要密一点才看得出 */
    for(var i=0;i<P.length-1;i+=step){
      var a=P[i], b=P[Math.min(i+1,P.length-1)];
      var dx=b.x-a.x, dz=b.z-a.z, L=Math.sqrt(dx*dx+dz*dz)||1;
      /* 支线朝码头方向微微变宽（漏斗），进港指向更明确；主航道等宽 */
      var hw2 = (k===0) ? hw : hw*(0.80 + 1.10*(i/(P.length-1)));
      var ux=dx/L*hl, uz=dz/L*hl, vx=-dz/L*hw2, vz=dx/L*hw2;
      pos.push(a.x-ux-vx, ROUTE_Y, a.z-uz-vz,
               a.x+ux-vx, ROUTE_Y, a.z+uz-vz,
               a.x+ux+vx, ROUTE_Y, a.z+uz+vz,
               a.x-ux+vx, ROUTE_Y, a.z-uz+vz);
      var pr=i/(P.length-1);
      att.push(pr,pr,pr,pr);
      idx.push(n,n+1,n+2, n,n+2,n+3); n+=4;
    }
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aT', new THREE.Float32BufferAttribute(att,1));
  g.setIndex(idx);
  var m=new THREE.Mesh(g, ROUTE_MAT);
  m.renderOrder = 3;
  return m;
}
if(ROUTE_ON){
  var routeDash = makeDashMesh([ROUTE].concat(SPURS));
  routeGroup.add(routeDash);
} else { var routeDash = null; }

/* 一艘慢慢巡航的小木船：船体 + 帆 + 尾迹，3 个 drawcall */
var boat = null, boatWake = null;
if(ROUTE_ON){
  boat = new THREE.Group();
  var hull = new THREE.Mesh(mergeParts([
    {g:new THREE.BoxGeometry(0.116,0.020,0.046), m:M(0,0,0), c:'#7d5436'},
    {g:new THREE.BoxGeometry(0.098,0.012,0.038), m:M(0,0.014,0), c:'#c69a68'},
    {g:new THREE.ConeGeometry(0.026,0.044,4), m:M(0.070,0,0, 0,0,-Math.PI/2), c:'#8b603c'},
    {g:new THREE.CylinderGeometry(0.003,0.003,0.126,5), m:M(-0.012,0.070,0), c:'#6f4c30'}
  ]), PAINT);
  boat.add(hull);
  var sailGeo = new THREE.BufferGeometry();
  sailGeo.setAttribute('position', new THREE.Float32BufferAttribute([
    -0.010,0.022,0,  -0.010,0.130,0,  0.068,0.026,0
  ],3));
  sailGeo.computeVertexNormals();
  boat.add(new THREE.Mesh(sailGeo, new THREE.MeshBasicMaterial({
    color:0xfff4dc, side:THREE.DoubleSide, transparent:true, opacity:0.96})));
  boatWake = new THREE.Mesh(new THREE.PlaneGeometry(0.11,0.030).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.26, depthWrite:false}));
  boatWake.position.set(-0.075,-0.012,0);
  boat.add(boatWake);
  boat.scale.setScalar(1.75);
  routeGroup.add(boat);
}
function routeAt(u){
  var f=(((u%1)+1)%1)*(ROUTE.length-1), i=Math.floor(f), w=f-i;
  var a=ROUTE[i], b=ROUTE[Math.min(i+1,ROUTE.length-1)];
  return {x:a.x+(b.x-a.x)*w, z:a.z+(b.z-a.z)*w, dx:b.x-a.x, dz:b.z-a.z};
}

/* ============ 每岛一个专属微动效 ============
   总览时只求「细看有活气」，进岛后各自明显；相位错开，避免齐步走。
   全部挂在独立 fxGroup（世界坐标）—— 不能挂进 isles[i].grp，
   否则会被 shelfMats 当成浅滩材质、夜里被 setNight 覆写 opacity。
   ?nofx=1 可整体关掉做对比（别用 ?fx=，会撞 focusX 机位参数）。 */
var FX_ON = !/[?&]nofx=1/.test(location.search);
var fxGroup = new THREE.Group(); scene.add(fxGroup);
var fxMats = [], isleFx = [];
var SOFT_DOT = (function(){
  var cv=document.createElement('canvas'); cv.width=cv.height=32;
  var g=cv.getContext('2d'), gr=g.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.45,'rgba(255,255,255,0.62)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,32,32);
  return new THREE.CanvasTexture(cv);
})();
function fxMat(color, day, night, isPoints, size){
  var m = isPoints
    ? new THREE.PointsMaterial({color:color, size:size||0.05, map:SOFT_DOT,
        transparent:true, opacity:day, depthWrite:false, sizeAttenuation:true})
    : new THREE.MeshBasicMaterial({color:color, transparent:true, opacity:day,
        depthWrite:false, side:THREE.DoubleSide});
  m.userData.__tinted = true;      /* 夜色自己管，不进全局 tint */
  m.userData.dayOp=day; m.userData.nightOp=night; m.userData.base=day; m.userData.shown=day;
  fxMats.push(m);
  return m;
}
function isleById(id){
  for(var i=0;i<isles.length;i++) if(isles[i].cfg.id===id) return isles[i];
  return null;
}
function addFx(F){ isleFx.push(F); if(F.o) fxGroup.add(F.o); return F; }

/* ============ 每岛港口 ===========
   有进港支线的岛配一座小木码头：甲板 + 系船柱 + 挂灯，船正好停在支线尽头。
   码头是「岛的建筑」不是航线 —— 单岛模式也要看得见，所以独立 pierGroup
   按岛控可见性（不挂进 routeGroup）；材质走 PAINT 随全局夜色变暗；
   不进 allLand/allLm，不碰拾取。挂灯白天灭、夜里亮成一点暖光，和航线流灯呼应。 */
var pierGroup = new THREE.Group(); scene.add(pierGroup);
if(ROUTE_ON){
  /* 尺度对齐小船（船长 ≈0.20 世界单位）：码头全长 ≈0.23，甲板抬到沫线之上，
     根部稍微探进沙滩沿里，视觉上「从岛上长出来」 */
  var PIER_PARTS = [
    {g:new THREE.BoxGeometry(0.225,0.007,0.078),          m:M(0.115,0.040,0),            c:'#bb8d5e'},
    {g:new THREE.BoxGeometry(0.225,0.005,0.009),          m:M(0.115,0.046, 0.035),       c:'#96683f'},
    {g:new THREE.BoxGeometry(0.225,0.005,0.009),          m:M(0.115,0.046,-0.035),       c:'#96683f'},
    {g:new THREE.CylinderGeometry(0.0045,0.0045,0.20,5), m:M(0.035,-0.075, 0.030),  c:'#6f4c30'},
    {g:new THREE.CylinderGeometry(0.0045,0.0045,0.20,5), m:M(0.035,-0.075,-0.030),  c:'#6f4c30'},
    {g:new THREE.CylinderGeometry(0.0045,0.0045,0.20,5), m:M(0.115,-0.075, 0.030),  c:'#6f4c30'},
    {g:new THREE.CylinderGeometry(0.0045,0.0045,0.20,5), m:M(0.115,-0.075,-0.030),  c:'#6f4c30'},
    {g:new THREE.CylinderGeometry(0.0045,0.0045,0.20,5), m:M(0.195,-0.075, 0.030),  c:'#6f4c30'},
    {g:new THREE.CylinderGeometry(0.0045,0.0045,0.20,5), m:M(0.195,-0.075,-0.030),  c:'#6f4c30'},
    {g:new THREE.CylinderGeometry(0.007,0.008,0.022,6),   m:M(0.205,0.056,0),            c:'#5c3f2a'},
    {g:new THREE.CylinderGeometry(0.003,0.003,0.060,5),   m:M(0.140,0.072,0.026),        c:'#54483c'},
    {g:new THREE.BoxGeometry(0.016,0.017,0.016),          m:M(0.140,0.106,0.026),        c:'#e8b96f'}
  ];
  for(var hi=0; hi<HARBORS.length; hi++){
    var hb=HARBORS[hi];
    var pier=new THREE.Mesh(mergeParts(PIER_PARTS), PAINT);
    pier.position.set(hb.is.x + hb.ex*(hb.d-0.045), WATER_Y+0.140, hb.is.z + hb.ez*(hb.d-0.045));
    pier.rotation.y = Math.atan2(-hb.ez, hb.ex);   /* 局部 +X 指向海面（进港方向） */
    pier.scale.setScalar(1.3);
    pier.userData.isle = hb.is.cfg.id;
    pierGroup.add(pier);
    if(FX_ON){
      /* 挂灯夜光晕（世界坐标，挂 fxGroup）：白天 0，夜里一点暖光 */
      /* 挂灯局部坐标 (0.140, 0.106, 0.022) 要按码头的 1.3 倍缩放折算，
         漏乘的话光晕和点光源会缩在甲板内侧 —— 原来那点白光基本埋在木板里 */
      var angL=Math.atan2(-hb.ez, hb.ex), PS=1.3;
      var lx2=(0.140*Math.cos(angL)+0.022*Math.sin(angL))*PS;
      var lz2=(-0.140*Math.sin(angL)+0.022*Math.cos(angL))*PS;
      var gGeo=new THREE.BufferGeometry();
      gGeo.setAttribute('position', new THREE.Float32BufferAttribute([
        pier.position.x+lx2, WATER_Y+0.280, pier.position.z+lz2],3));
      var gPts=new THREE.Points(gGeo, fxMat(0xffd9a0, 0.0, 0.85, true, 0.055));
      addFx({k:'lantern', is:hb.is, mat:gPts.material, o:gPts, ph:hi*0.9});
      LAMP_PTS.push({x:pier.position.x+lx2, y:WATER_Y+0.302, z:pier.position.z+lz2});

      /* 水面暖光倒影：码头周边那圈浅滩是不受光的 MeshBasicMaterial（贴岛轮廓的
         独立环带，为了压住网格插值糊出来的光晕才这么做的），点光源在它上面照不出
         任何光池 —— 所以另贴一片加色柔光盘当倒影，比改浅滩材质稳妥得多，
         手机上也不增加光源数量。白天 visible=false，完全零开销。 */
      var wg=new THREE.Mesh(new THREE.PlaneGeometry(0.82, 1.08), WATER_GLOW_MAT);
      wg.rotation.x=-Math.PI/2;
      wg.position.set(pier.position.x+lx2*0.62, WATER_Y+0.017, pier.position.z+lz2*0.62);
      wg.visible=false;
      scene.add(wg);
      WATER_GLOWS.push(wg);
    }
  }
}

/* ============ 码头灯笼 → 真点光源 ============
   原来灯笼只是个发光片（Points + 加色材质），夜里码头地面、木板、近岸水面
   全是黑的 —— 一个亮斑浮在黑暗里，读不出「这里有灯」。
   改成每个码头挂一盏真 PointLight：地面被暖光照亮，光池沿距离自然衰减。
   成本控制：白天 visible=false（不进光源列表，零开销）；夜里才加入。
   手机把 distance 收到 1.55 —— 点光源是逐片元循环，7 盏全开会明显吃帧。 */
var LAMP_DIST = HAS_TOUCH ? 3.20 : 4.20;
var LAMP_INT  = HAS_TOUCH ? 3.10 : 3.90;
var LAMP_WARM = 0xffb264;
function buildPierLamps(){
  for(var i=0;i<LAMP_PTS.length;i++){
    var q=LAMP_PTS[i];
    var pl=new THREE.PointLight(LAMP_WARM, 0, LAMP_DIST, 1.7);
    pl.position.set(q.x, q.y, q.z);
    pl.visible=false;
    scene.add(pl);
    LAMP_LIGHTS.push(pl);
  }
}
buildPierLamps();

/* ============ 轨道式上岸（漫游第 ① 步） ===========
   点岛 → 镜头从等距俯视降到近海面 → 沿码头方向轨道推近 → 抬回单岛视角；
   小人从停泊的小船边下船，沿码头→石板路走到地标旁，之后常驻岛上。
   没有自由控制，本质就是「一条固定镜轨 + 一条固定步行轨」。
   ?land=<岛名> 自动播放；?lt=<秒> 定格任意帧（出图/验收用）；
   ?nland=1 关掉，回到原来的 900ms 快速推近。
   HERO/SNAP 不带 land 时一律不触发，既有海报构图完全不受影响。 */
var LAND_DUR  = 5.6;                                  // 秒
var LAND_OFF  = /[?&]nland=1/.test(location.search);
var LAND_HOLD = (function(){
  var m = location.search.match(/[?&]lt=([0-9.]+)/);
  return m ? Math.max(0, Math.min(LAND_DUR, parseFloat(m[1]))) : null;
})();
var landSeq = null, landHarbor = null;
var walker = null, legL = null, legR = null, armL = null, armR = null;

/* 低模小人：大衣/围巾/头/脸/背包/斜挎带合成 1 个 mesh，两条腿和两条胳膊各自挂 pivot 摆动。
   用 PAINT（共享材质）→ 夜色自动跟随；不进 allLand/allLm，不参与拾取。
   尺度基准：1.0 时身高约 0.09 世界单位，仅到低矮树丛的高度 —— 别放大成巨人。
   正面 = 本地 +Z（walk 里用 rotation.y = atan2(dx,dz)），所以眼睛/鼻子/嘴一律放 +Z 侧。 */
(function buildWalker(){
  walker = new THREE.Group();
  var SKIN = '#f2cfa8', HAIR = '#3b3129', INK = '#2b2622';
  var body = new THREE.Mesh(mergeParts([
    {g:new THREE.CylinderGeometry(0.0095,0.0130,0.036,7),  m:M(0,0.050,0),        c:'#37628a'},   /* 大衣躯干 */
    {g:new THREE.CylinderGeometry(0.0130,0.0142,0.008,7),  m:M(0,0.0315,0),       c:'#2c5174'},   /* 大衣下摆 */
    {g:new THREE.CylinderGeometry(0.0102,0.0102,0.006,7),  m:M(0,0.0685,0),       c:'#c8703c'},   /* 围巾 */
    {g:new THREE.BoxGeometry(0.0058,0.0130,0.0030),
       m:M(-0.0078,0.0618,-0.0090, 0.20,0,0.10), c:'#b3612f'},                                /* 围巾垂尾 */
    {g:new THREE.SphereGeometry(0.0105,8,6),               m:M(0,0.0815,0),       c:SKIN},        /* 头 */
    /* 头发要抬到眼睛上方：原来 thetaLength=0.52π，下沿落在 y=0.0833，
       正好把眼睛的位置盖住 —— 脸是最后加的，一加才发现被头发挡上了 */
    {g:new THREE.SphereGeometry(0.0108,8,5,0,TAU,0,Math.PI*0.47),
                                                           m:M(0,0.0862,0),       c:HAIR},        /* 头发 */
    {g:new THREE.BoxGeometry(0.0136,0.0038,0.0034),
       m:M(0,0.0888,0.0068, -0.34,0,0), c:HAIR},                                             /* 刘海 */
    /* 五官：都用 ico 低模球，块面和全身一致；半径按「近景 40~50px 头宽」反推，
       小于 0.0015 在漫游机位下就只剩一个像素，等于没加 */
    {g:icoG(0.0019,0), m:M(-0.0036,0.0822,0.0090), c:INK},                                   /* 左眼 */
    {g:icoG(0.0019,0), m:M( 0.0036,0.0822,0.0090), c:INK},                                   /* 右眼 */
    {g:icoG(0.0016,0), m:M(0,0.0794,0.0100), c:'#e2ba96'},                                   /* 鼻子 */
    {g:new THREE.BoxGeometry(0.0042,0.0012,0.0014),
       m:M(0,0.0768,0.0092), c:'#c07f6b'},                                                   /* 嘴 */
    {g:new THREE.BoxGeometry(0.0105,0.0135,0.0058),        m:M(0,0.051,-0.0122),  c:'#b06538'},   /* 背包 */
    {g:new THREE.BoxGeometry(0.0035,0.020,0.0022),         m:M(0,0.052,0.0100, 0,0,-0.42), c:'#54483c'}  /* 斜挎带 */
  ]), PAINT);
  walker.add(body);
  /* 腿：裤子+鞋头分色，pivot 挪到髋部 */
  var legGeo = mergeParts([
    {g:new THREE.BoxGeometry(0.0058,0.0195,0.0072), m:M(0,-0.0098,0),        c:'#2e3a48'},
    {g:new THREE.BoxGeometry(0.0062,0.0058,0.0086), m:M(0,-0.0222,0.0009),   c:'#3b3129'}
  ]);
  legL = new THREE.Mesh(legGeo, PAINT);
  legR = new THREE.Mesh(legGeo.clone(), PAINT);
  /* 两条腿必须左右分开（±x）。原来写成 ±z，从正面看就是一前一后叠在一起，
     整个人只剩一根柱子 —— 腿都摆动了，正面还不知道有两条腿 */
  legL.position.set(-0.0036,0.0298,0);
  legR.position.set( 0.0036,0.0298,0);
  walker.add(legL, legR);
  /* 胳膊：必须单独挂 pivot 才能摆。袖口 + 手分色 —— 原来是一根秃棍，
     近景整个人就「没有末端」，看着像截木头桩子。
     rotation.z 的符号决定手是往里收还是往外张：Rz(θ) 把 -Y 转到 (sinθ,-cosθ)，
     所以左臂要负角、右臂要正角，手才会甩到衣身外面来。 */
  var armGeo = mergeParts([
    /* 肩头补一颗球：圆柱的顶盖是平的，直接接到衣身上会在肩膀处
       切出一道硬边，远看像挂了两个「翅膀」或口袋 */
    {g:icoG(0.0037,0),                                     m:M(0,0.0004,0), c:'#37628a'},
    {g:new THREE.CylinderGeometry(0.0036,0.0032,0.0155,5), m:M(0,-0.0078,0), c:'#37628a'},   /* 袖子 */
    {g:new THREE.CylinderGeometry(0.0033,0.0033,0.0022,5), m:M(0,-0.0166,0), c:'#2c5174'},   /* 袖口 */
    {g:icoG(0.0031,0),                                     m:M(0,-0.0198,0), c:SKIN}         /* 手 */
  ]);
  armL = new THREE.Mesh(armGeo, PAINT);
  armR = new THREE.Mesh(armGeo.clone(), PAINT);
  armL.position.set(-0.0118,0.0608,0); armL.rotation.z = -0.10;
  armR.position.set( 0.0118,0.0608,0); armR.rotation.z =  0.10;
  walker.add(armL, armR);
  walker.visible = false;
  scene.add(walker);
})();

/* 地面高度：topY 在 rf>0.9 会返回 null（沙滩区），这里去掉限制，
   并把 rf 夹在 0.999 内 —— 海面段自然落到 PROF 末端（海边高度）。 */
function groundYAt(is, wx, wz){
  var x=wx-is.x, z=wz-is.z;
  var u=x/is.shape.sx, v=z/is.shape.sz;
  var rf=Math.min(0.999, Math.sqrt(u*u+v*v)/Rat(is.shape, Math.atan2(v,u)));
  return landY(u, v, rf, is.cfg) + 0.010;
}
/* 步行轨：码头外端（船边）→ 甲板 → 沙滩 → 岛内 → 地标前。
   有支线的岛用码头方向；主岛 gate 没有码头，用石板路 pathAngle 顶上。 */
function landingPath(is){
  var hb=null;
  for(var i=0;i<HARBORS.length;i++) if(HARBORS[i].is===is) hb=HARBORS[i];
  var ex,ez,d;
  if(hb){ ex=hb.ex; ez=hb.ez; d=hb.d; }
  else { var pa=is.cfg.pathAngle||0; ex=Math.cos(pa); ez=Math.sin(pa);
         d=Math.max(is.shape.sx,is.shape.sz)*1.02; }
  var px=-ez, pz=ex;
  function P(r,side,y){ return new THREE.Vector3(is.x+ex*r+px*side, y, is.z+ez*r+pz*side); }
  var p0=P(d+0.30, 0,    WATER_Y+0.070);   /* 船边 */
  var p1=P(d+0.05, 0.02, WATER_Y+0.190);   /* 踏上甲板 */
  var p2=P(d-0.22, 0.06, 0);
  var p3=P(d*0.52, 0.10, 0);
  var p4=new THREE.Vector3(is.x+is.lx-ex*0.18, 0, is.z+is.lz-ez*0.18);
  p2.y=groundYAt(is,p2.x,p2.z); p3.y=groundYAt(is,p3.x,p3.z);
  p4.y=groundYAt(is,p4.x,p4.z);
  var curve=new THREE.CatmullRomCurve3([p0,p1,p2,p3,p4], false, 'centripetal');
  return {curve:curve, ex:ex, ez:ez, d:d, dock:p0};
}
function lmix(a,b,k){ return a+(b-a)*k; }
function lsmooth(a,b,p){ var k=Math.max(0,Math.min(1,(p-a)/(b-a))); return k*k*(3-2*k); }

/* 三段镜轨端点：A 近海面 / B 轨道推近 / C 标准单岛机位。
   全部用相对 isleZoom 的倍数，横竖屏自适应，不写死相机距离。 */
function landCam(p,S){
  /* 竖屏下 B/A 段的「比单岛远一点」会把岛压得太小，收 20% */
  var zI=S.zI*(camera.aspect<0.9 ? 0.80 : 1), thT=S.th0+S.dth, is=S.is, pa=S.path;
  /* theta 始终侧偏 ~0.5rad：正对码头会把它压成一根棍，斜看才认得出是栈桥。
     A 段焦点只往码头方向偏 0.3d，zoom 也只比单岛远 1.55 倍 —— 岛始终是画面主体 */
  var A={th:thT+0.62, ph:0.98,     z:zI*1.45,
         fx:is.x, fz:is.z, ly:-0.06};
  var B={th:thT+0.52, ph:0.86,     z:zI*1.12, fx:is.x, fz:is.z, ly:0.01};
  var C={th:thT+0.46, ph:PHI_ISLE, z:zI,      fx:is.x, fz:is.z, ly:-0.02};
  var P,Q,k;
  if(p<0.38)      { P=S.s; Q=A; k=lsmooth(0,0.38,p); }
  else if(p<0.78) { P=A;   Q=B; k=lsmooth(0.38,0.78,p); }
  else            { P=B;   Q=C; k=lsmooth(0.78,1,p); }
  theta  = lmix(P.th,Q.th,k); phi   = lmix(P.ph,Q.ph,k);
  zoom   = lmix(P.z, Q.z, k);
  /* 焦点从总览原点快速归到岛心（约 1 秒完成）—— 若按整段插值，
     前半程镜头还对着海，岛会被甩到画面边上 */
  var kf = lsmooth(0,0.18,p);
  focusX = lmix(S.s.fx, is.x, kf);
  focusZ = lmix(S.s.fz, is.z, kf);
  lookY  = lmix(P.ly,Q.ly,k);
}
function landWalk(p,S){
  var k=Math.max(0,Math.min(1,(p-0.10)/0.76)), u=lsmooth(0,1,k);
  var pt=S.path.curve.getPoint(u), nx=S.path.curve.getPoint(Math.min(1,u+0.01));
  walker.position.copy(pt);
  var dx=nx.x-pt.x, dz=nx.z-pt.z;
  var yaw = Math.atan2(dx,dz);   /* 正面=本地+z：Y=atan2(dx,dz) */
  /* 走到地标前慢慢回身面对镜头，别留一个后脑勺给镜头 */
  walker.rotation.y = yaw + lsmooth(0.86,1,p)*Math.PI*1.15;
  var moving=(k>0 && k<1), sw=Math.sin(u*46);
  legL.rotation.x = moving ? sw*0.42 : 0;
  legR.rotation.x = moving ? -sw*0.42 : 0;
  armL.rotation.x = moving ? -sw*0.55 : 0;
  armR.rotation.x = moving ?  sw*0.55 : 0;
  if(moving) walker.position.y += Math.abs(sw)*0.0022;
  walker.scale.setScalar(1.2*Math.max(0, Math.min(1,(p-0.06)/0.08)));
}
function startLanding(is, fromURL){
  if(!is) return;
  if(LAND_OFF && !fromURL){ enterIsle(is.cfg.id); return; }
  if((SNAP || HERO) && !fromURL){ enterIsle(is.cfg.id, true); return; }
  var path=landingPath(is);
  var s={th:theta, ph:phi, z:zoom, fx:focusX, fz:focusZ,
         ly:(lookY===null?defaultLookY():lookY)};
  var thT=Math.atan2(path.ex, path.ez);
  var dth=((thT - s.th + Math.PI*3) % (Math.PI*2)) - Math.PI;   // 走最短角差
  landSeq={is:is, path:path, zI:isleZoom(is.cfg,is.shape), s:s,
           th0:s.th, dth:dth, t0:performance.now(), dur:LAND_DUR*1000};
  landHarbor=path;
  camTween=null;
  MODE='isle'; curIsle=is;
  closeWork(true);
  showOnly(is);            /* 全程孤岛：低机位不穿帮，海面构图更干净 */
  setDetail(true);
  backBtn.hidden=false;
  bK.textContent='ISLE · 0'+(isles.indexOf(is)+1)+' / 07';
  bH.textContent=WORKS[is.cfg.id] ? WORKS[is.cfg.id].title : is.cfg.id;
  dropHint();
  walker.visible=true;
}
function stepLanding(){
  if(!landSeq) return;
  var S=landSeq;
  var p=(LAND_HOLD!==null) ? LAND_HOLD/LAND_DUR
                           : Math.min(1,(performance.now()-S.t0)/S.dur);
  landCam(p,S); landWalk(p,S);
  if(p>=1 && LAND_HOLD===null){
    landSeq=null;
    if(walkReady(S.is)) enterWalk(S.is);   /* 落定即自由走 */
  }
}
function finishLanding(){        /* 过场中任意点击 = 跳过，立刻落终态 */
  if(!landSeq) return;
  var S=landSeq;
  landCam(1,S); landWalk(1,S);
  landSeq=null;
  updateCamera();
  if(walkReady(S.is)) enterWalk(S.is);
}

/* ============ 自由走（第②步 · 已开放全部 7 岛）============
   上岸落定后小人留在岛上：手机摇杆 / 电脑 WASD / 点地面自由走动，
   相机不重建 —— 球坐标焦点平滑跟随小人，拖拽=环绕、双指=远近，
   现有 orbit 手感自动变成第三人称镜头。
   边界：岛缘 rf≤0.84（草地面内，不下海不站崖）；地标亭一圈避让。
   内容触发：走近地标自动弹该岛作品卡，走远收起。
   ?nwalk=1 退回纯展示；SNAP/HERO 海报模式与总览不经过这里。 */
var WALK_OFF = /[?&]nwalk=1/.test(location.search);
var HAS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints||0) > 0
  || location.search.indexOf('touch=1') >= 0;   /* ?touch=1 调试：模拟手机输入 */
var walkIsle=null, walkOn=false, walkSpd=0.13;
var walkTarget=null;                       /* 点地面行走的目标点（世界坐标） */
var dpadEl=null;
var wPhiT=1.0, wZoomT=0, wZoom=0;          /* 跟随镜头的目标仰角 / 目标半径 */
var wKF={x:0, z:0, y:0};                   /* 平滑焦点（指数收敛） */
var walkPhase=0, lastT=null;
var joyEl=null, joyKnob=null;
var joy={x:0, y:0, on:false, id:null};
var keysDown={};
function walkReady(is){ return !WALK_OFF && !SNAP && !HERO && !!is; }
function enterWalk(is){
  walkIsle=is; walkOn=true; autoSpin=false;
  setShadowFocus(is.x, is.z, 2.7);   /* 近景只需罩住这座岛，阴影分辨率翻三倍 */
  document.getElementById('spin').classList.remove('on');
  var zI=isleZoom(is.cfg,is.shape), portrait=camera.aspect<0.9;
  wZoom=zI; wZoomT=zI*(portrait?0.26:0.30);
  wPhiT=portrait?1.02:0.96;
  wKF.x=walker.position.x; wKF.z=walker.position.z; wKF.y=walker.position.y;
  focusX=wKF.x; focusZ=wKF.z; lookY=wKF.y+0.02;
  walkPhase=0;
  /* 出图调试：?wtp=<角度> 把小人直接摆到距地标 0.13 的圆周上，验证跟随镜头与自动弹卡。
     无头环境 rAF 几乎不渲染（虚拟时间都给了定时器），缓动跑不起来 —— 所以连同镜头一起落终态 */
  var wm=location.search.match(/[?&]wtp=([0-9.]+)/);
  if(wm){
    var wa=parseFloat(wm[1]);
    walker.position.set(is.x+is.lx+Math.cos(wa)*0.13, 0, is.z+is.lz+Math.sin(wa)*0.13);
    walker.position.y=groundYAt(is,walker.position.x,walker.position.z);
    walker.rotation.y=Math.atan2(is.x+is.lx-walker.position.x, is.z+is.lz-walker.position.z);
    wZoom=wZoomT; phi=wPhiT;
    wKF.x=walker.position.x; wKF.z=walker.position.z; wKF.y=walker.position.y;
    focusX=wKF.x; focusZ=wKF.z; lookY=wKF.y+0.015;
  }
  /* 出图调试：?wbd=<0-1> 把小人摆到上岸曲线的指定进度处（验证登船区/跟随镜头） */
  var bm=location.search.match(/[?&]wbd=([0-9.]+)?/);
  if(bm){
    var lp2=landingPath(is);
    var px2=parseFloat(bm[1]||'0.62');
    var sel=lp2.curve.getPoint(px2);
    walker.position.set(sel.x, 0, sel.z);
    walker.position.y=groundYAt(is,sel.x,sel.z);
    var uu=(sel.x-is.x)/is.shape.sx, vv=(sel.z-is.z)/is.shape.sz;
    var rfv=Math.hypot(uu,vv)/Rat(is.shape, Math.atan2(vv,uu));
    wZoom=wZoomT; phi=wPhiT;
    wKF.x=walker.position.x; wKF.z=walker.position.z; wKF.y=walker.position.y;
    focusX=wKF.x; focusZ=wKF.z; lookY=wKF.y+0.015;
    document.title='BD u'+px2+' rf'+rfv.toFixed(3)+' p'+sel.x.toFixed(2)+','+sel.z.toFixed(2)
      +' VOY:'+(voyIsle===is?'on':'off');
  }
  if(!joyEl){ joyEl=document.getElementById('joy'); joyKnob=document.getElementById('joyKnob'); }
  if(!dpadEl) dpadEl=document.getElementById('dpad');
  if(dpadEl) dpadEl.classList.toggle('on', !HAS_TOUCH);
  walkTarget=null;
  /* 手机：提示条会压住摇杆，直接收起；桌面端抬到方向键之上再淡出 */
  hintEl.style.bottom='calc(168px + env(safe-area-inset-bottom))';   /* 抬到乘船条（120px）之上，别叠字 */
  if(HAS_TOUCH){ joyEl.classList.add('on'); hintEl.style.display='none'; }
  else {
    hintEl.textContent='WASD / 方向键 移动 · 或点地面走过去 · 拖动转视角';
    hintEl.style.opacity='1';
    setTimeout(function(){ hintEl.style.opacity='0'; }, 4200);
  }
}
function exitWalk(){
  walkOn=false; walkIsle=null; walker.visible=false;
  walkTarget=null;
  setShadowFocus(0, 0, SH_R);        /* 回到总览，阴影相机罩回整个群岛 */
  hintEl.style.bottom='';
  if(hintEl.style.display==='none') hintEl.style.display='';
  if(joyEl) joyEl.classList.remove('on');
  if(dpadEl) dpadEl.classList.remove('on');
  resetJoy(); keysDown={};
}
function resetJoy(){
  joy.x=0; joy.y=0; joy.on=false; joy.id=null;
  if(joyKnob) joyKnob.style.transform='translate(-50%,-50%)';
}
/* 点地面行走：目标点先夹进可走范围（岛缘内 + 避开地标亭），
   实际行进中每步还有同样的边界推回，两道保险 */
function setWalkTarget(wx, wz){
  if(!walkIsle || !walker) return;
  var is=walkIsle;
  var u=(wx-is.x)/is.shape.sx, v=(wz-is.z)/is.shape.sz;
  var rf=Math.hypot(u,v)/Rat(is.shape, Math.atan2(v,u));
  if(rf>0.84){
    var kb=0.84/rf;
    wx=is.x+(wx-is.x)*kb; wz=is.z+(wz-is.z)*kb;
  }
  var lxw=is.x+is.lx, lzw=is.z+is.lz;
  var ddx=wx-lxw, ddz=wz-lzw, dl=Math.hypot(ddx,ddz);
  if(dl<0.155){
    if(dl<1e-5){ ddx=1; ddz=0; dl=1; }
    wx=lxw+ddx/dl*0.155; wz=lzw+ddz/dl*0.155;
  }
  walkTarget = Math.hypot(wx-walker.position.x, wz-walker.position.z)>0.03
    ? {x:wx, z:wz} : null;
}
/* 输入聚合：键盘 + 摇杆 → (前进, 右移)，模长夹 1 */
function walkInput(){
  var f=0, r=0;
  if(keysDown['w']||keysDown['arrowup'])    f+=1;
  if(keysDown['s']||keysDown['arrowdown'])  f-=1;
  if(keysDown['a']||keysDown['arrowleft'])  r-=1;
  if(keysDown['d']||keysDown['arrowright']) r+=1;
  if(joy.on){ f+=-joy.y; r+=joy.x; }
  var m=Math.hypot(f,r);
  if(m>1){ f/=m; r/=m; }
  return {f:f, r:r, m:Math.min(1,m)};
}
function stepWalk(dt){
  if(!walkOn || !walkIsle) return;
  var is=walkIsle, inp=walkInput(), dx=0, dz=0;
  if(inp.m>0.02){                       /* 手动输入优先：一动手就取消点地目标 */
    walkTarget=null;
    /* 相机相对：forward=镜头朝向 XZ 投影，right=垂直分量 */
    var fx=-Math.sin(theta), fz=-Math.cos(theta);
    var rx= Math.cos(theta), rz=-Math.sin(theta);
    dx=(fx*inp.f+rx*inp.r)*walkSpd*dt;
    dz=(fz*inp.f+rz*inp.r)*walkSpd*dt;
  } else if(walkTarget){                /* 点地面行走：朝目标点走，近了减速停步 */
    var tdx=walkTarget.x-walker.position.x, tdz=walkTarget.z-walker.position.z;
    var td=Math.hypot(tdx,tdz);
    if(td<0.03){ walkTarget=null; }
    else{
      var st=Math.min(td, walkSpd*dt*Math.max(0.35, Math.min(1, td/0.16)));
      dx=tdx/td*st; dz=tdz/td*st;
    }
  }
  var moving=(dx!==0 || dz!==0);
  if(moving){
    var nx=walker.position.x+dx, nz=walker.position.z+dz;
    /* 边界：岛缘 rf≤0.84 */
    var u=(nx-is.x)/is.shape.sx, v=(nz-is.z)/is.shape.sz;
    var rf=Math.hypot(u,v)/Rat(is.shape, Math.atan2(v,u));
    if(rf>0.84){
      var kb=0.84/rf;
      nx=is.x+(nx-is.x)*kb; nz=is.z+(nz-is.z)*kb;
    }
    /* 避让：地标亭一圈（走了进就推出去） */
    var lxw=is.x+is.lx, lzw=is.z+is.lz;
    var ddx=nx-lxw, ddz=nz-lzw, dl=Math.hypot(ddx,ddz);
    if(dl<0.155){
      if(dl<1e-5){ ddx=1; ddz=0; dl=1; }
      nx=lxw+ddx/dl*0.155; nz=lzw+ddz/dl*0.155;
    }
    /* 面朝移动方向：模型正面是本地 +z，正面=(sinY,cosY) → Y=atan2(dx,dz) */
    walker.rotation.y=Math.atan2(dx,dz);
    walker.position.x=nx; walker.position.z=nz;
    walkPhase+=dt*8.2*Math.max(0.45,inp.m);
  } else {
    walkPhase*=Math.max(0,1-dt*6);          /* 收步：腿摆平滑归零 */
  }
  walker.position.y=groundYAt(is,walker.position.x,walker.position.z)
    +(moving?Math.abs(Math.sin(walkPhase))*0.0022:0);
  var sw=Math.sin(walkPhase)*0.42;
  legL.rotation.x=sw; legR.rotation.x=-sw;
  /* 胳膊与同侧腿反相 —— 手脚同向就是僵尸走 */
  armL.rotation.x=-sw*1.30; armR.rotation.x=sw*1.30;
  /* 跟随镜头：焦点指数平滑；phi/zoom 向目标收拢；theta 完全交给用户 */
  var kzc=Math.min(1,dt*2.2), kfc=Math.min(1,dt*4.2);
  wZoom+=(wZoomT-wZoom)*kzc;
  phi+=(wPhiT-phi)*Math.min(1,dt*2.6);
  zoom=wZoom;
  wKF.x+=(walker.position.x-wKF.x)*kfc;
  wKF.z+=(walker.position.z-wKF.z)*kfc;
  wKF.y+=(walker.position.y-wKF.y)*kfc;
  focusX=wKF.x; focusZ=wKF.z;
  lookY=wKF.y+0.015;
  /* 内容触发：走近弹卡、走远收起 */
  var dlw=Math.hypot(walker.position.x-(is.x+is.lx), walker.position.z-(is.z+is.lz));
  var wid=is.cfg.id;
  if(dlw<0.165 && curWork!==wid) openWork(wid);
  else if(dlw>0.26 && curWork===wid) closeWork(true);
  /* 登船区：走到码头根部（gate 是石板路口）弹出乘船条。
     登船点不能取上岸曲线的固定 u —— 码头在岛缘之外（rf≈0.9~1.5），
     小人被 0.84 边界挡住永远够不到。改为从岛内端(u=1)往码头方向扫，
     取最后一个 rf≤0.78 的点 = 「可走范围内的码头根部」。 */
  if(!voyage){
    var bp=is._boardPt;
    if(!bp){
      bp={x:is.x+is.lx, z:is.z+is.lz};
      var cv=landingPath(is).curve, q=cv.getPoint(1);
      for(var ub=1; ub>=0.30; ub-=0.02){
        q=cv.getPoint(ub);
        var ub2=(q.x-is.x)/is.shape.sx, vb2=(q.z-is.z)/is.shape.sz;
        var rfb=Math.hypot(ub2,vb2)/Rat(is.shape, Math.atan2(vb2,ub2));
        if(rfb>0.78) break;
        bp={x:q.x, z:q.z};
      }
      is._boardPt=bp;
    }
    var bd=Math.hypot(walker.position.x-bp.x, walker.position.z-bp.z);
    setVoy(bd<0.20, is);
    if(location.search.indexOf('vdbg=1')>=0) document.title='WALK '+(voyIsle===is?'VOY':'-')
      +' d'+bd.toFixed(3)+' bp'+bp.x.toFixed(2)+','+bp.z.toFixed(2)
      +' w'+walker.position.x.toFixed(2)+','+walker.position.z.toFixed(2);
  }
}
/* 摇杆：独立 DOM，不与画布的拖拽/拾取冲突 */
(function(){
  function jstart(e){
    if(!walkOn) return;
    e.preventDefault(); e.stopPropagation();
    joy.on=true; joy.id=e.pointerId;
    if(joyEl.setPointerCapture) try{ joyEl.setPointerCapture(e.pointerId); }catch(_e){}
    joyEl.classList.add('active');
    jmove(e);
  }
  function jmove(e){
    if(!joy.on || e.pointerId!==joy.id) return;
    var rc=joyEl.getBoundingClientRect();
    var dx=(e.clientX-(rc.left+rc.width/2))/(rc.width/2);
    var dy=(e.clientY-(rc.top+rc.height/2))/(rc.height/2);
    var m=Math.hypot(dx,dy);
    if(m>1){ dx/=m; dy/=m; }
    joy.x=dx; joy.y=dy;
    joyKnob.style.transform='translate(calc(-50% + '+(dx*28).toFixed(1)+'px), calc(-50% + '+(dy*28).toFixed(1)+'px))';
  }
  function jend(e){
    if(e.pointerId===joy.id){ resetJoy(); joyEl.classList.remove('active'); }
  }
  joyEl=document.getElementById('joy'); joyKnob=document.getElementById('joyKnob');
  joyEl.addEventListener('pointerdown', jstart);
  joyEl.addEventListener('pointermove', jmove);
  joyEl.addEventListener('pointerup', jend);
  joyEl.addEventListener('pointercancel', jend);
})();
/* 屏幕方向键：按住 = 移动。不依赖键盘焦点（预览面板/iframe 里键盘常拿不到） */
(function(){
  dpadEl=document.getElementById('dpad');
  if(!dpadEl) return;
  var btns=dpadEl.querySelectorAll('button');
  btns.forEach ? btns.forEach(bind) : Array.prototype.forEach.call(btns, bind);
  function bind(b){
    b.addEventListener('pointerdown', function(e){
      e.preventDefault(); e.stopPropagation();
      if(!walkOn) return;
      try{ dpadEl.setPointerCapture(e.pointerId); }catch(_e){}
      keysDown[b.dataset.k]=true; walkTarget=null;
      b.classList.add('on');
    });
    function off(){
      keysDown[b.dataset.k]=false;
      b.classList.remove('on');
    }
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
  }
})();
/* 漫游外的移动键 = 想走但还没进漫游 → 给一句指路提示 */
var tipTimer=null;
function tip(msg){
  hintEl.textContent=msg; hintEl.style.opacity='1';
  if(tipTimer) clearTimeout(tipTimer);
  tipTimer=setTimeout(function(){ hintEl.style.opacity='0'; }, 3400);
}
window.addEventListener('keydown', function(e){
  var k=e.key.toLowerCase();
  var isMoveKey=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>=0;
  if(isMoveKey && walkOn){
    e.preventDefault(); keysDown[k]=true; walkTarget=null;
  } else if(isMoveKey && !landSeq){
    if(MODE==='arch') tip('点岛上岸后可自由走动 · 7 座岛都已开放');
    else tip('点岛上岸即可自由走动');
  }
});
window.addEventListener('keyup', function(e){ keysDown[e.key.toLowerCase()]=false; });

/* ============ 漫游第③步：跨岛乘船 ============
   走到码头根部（gate 是石板路口）→ 弹「乘船去」岛名条 → 选岛后：
   登船（小人走上码头，小船就停在泊位）→ 起航（船沿「支线→主航道→支线」
   真实航线开往目标岛，镜头拉远跟随，半程目标岛渐显）→ 到港（船落泊位，
   交接给第①步上岸镜轨，落定即目标岛漫游）。航程中点一下 = 跳过。
   gate 无进港支线：主航道最近点 → 港位 直线替代。 */
var ISLE_SHORT = {gate:'石门', houseBlue:'蓝顶小屋', houseWood:'木屋',
                  pavilion:'OASIS', windmill:'风车', lookout:'瞭望塔', torii:'鸟居'};
var voyEl=null, voyIsle=null, voyage=null;

function buildVoy(fromIs){
  var html='';
  for(var i=0;i<isles.length;i++){
    var is2=isles[i];
    if(is2===fromIs) continue;
    html+='<button type="button" data-id="'+is2.cfg.id+'">0'+(i+1)+' '+
          (ISLE_SHORT[is2.cfg.id]||is2.cfg.id)+'</button>';
  }
  var box=document.getElementById('voyChips');
  box.innerHTML=html;
  var btns=box.querySelectorAll('button');
  Array.prototype.forEach.call(btns, function(b){
    b.addEventListener('click', function(){ startVoyage(isleById(b.dataset.id)); });
  });
}
function setVoy(on, isle){
  if(!voyEl) voyEl=document.getElementById('voy');
  if(on){
    if(voyIsle!==isle) buildVoy(isle);
    voyIsle=isle;
    voyEl.classList.add('on');
    if(hintEl && hintEl.style.opacity!=='0') hintEl.style.opacity='0';  /* 别和乘船条叠字 */
  } else {
    voyEl.classList.remove('on');
    voyIsle=null;
  }
}
function hideVoy(){ setVoy(false, null); }

function harborOf(is){
  for(var i=0;i<HARBORS.length;i++) if(HARBORS[i].is===is) return HARBORS[i];
  return null;
}
function routeIndexOf(pt){
  var bi=0, bd=1e9;
  for(var i=0;i<ROUTE.length;i++){
    var d=(ROUTE[i].x-pt.x)*(ROUTE[i].x-pt.x)+(ROUTE[i].z-pt.z)*(ROUTE[i].z-pt.z);
    if(d<bd){ bd=d; bi=i; }
  }
  return bi;
}
function synthSpur(is){        /* gate 无支线：主航道最近点 → 港位 直线 */
  var hb=harborOf(is), m={x:is.x+hb.ex*hb.d, z:is.z+hb.ez*hb.d};
  var A=ROUTE[routeIndexOf(m)], seg=[], n=8;
  for(var s=0;s<=n;s++){
    var u=s/n;
    seg.push(new THREE.Vector3(A.x+(m.x-A.x)*u, ROUTE_Y, A.z+(m.z-A.z)*u));
  }
  return seg;
}
function sailPath(fromIs, toIs){
  var pts=[], hbf=harborOf(fromIs), i;
  var p0f=landingPath(fromIs).dock;            /* 船当前泊位（甲板外端） */
  pts.push(new THREE.Vector3(p0f.x+hbf.ex*0.11, ROUTE_Y+0.018, p0f.z+hbf.ez*0.11));
  var spurA=SPUR_BY_ID[fromIs.cfg.id]||synthSpur(fromIs);
  for(i=spurA.length-1;i>=0;i--) pts.push(spurA[i]);          /* 退出支线 */
  var spurB=SPUR_BY_ID[toIs.cfg.id]||synthSpur(toIs);
  var ia=routeIndexOf(spurA[0]), ib=routeIndexOf(spurB[0]), N=ROUTE.length;
  var fwd=(ib-ia+N)%N, bwd=(ia-ib+N)%N;
  var dir=fwd<=bwd?1:-1, cnt=fwd<=bwd?fwd:bwd;                /* 主航道走近方向 */
  for(i=1;i<cnt;i++) pts.push(ROUTE[(ia+dir*i+N)%N]);
  for(i=0;i<spurB.length;i++) pts.push(spurB[i]);             /* 进目标支线 */
  var hbt=harborOf(toIs), p0t=landingPath(toIs).dock;
  pts.push(new THREE.Vector3(p0t.x+hbt.ex*0.11, ROUTE_Y+0.018, p0t.z+hbt.ez*0.11));
  return pts;
}
function polylineLUT(pts){
  var cum=[0], L=0;
  for(var i=1;i<pts.length;i++){
    L+=Math.hypot(pts[i].x-pts[i-1].x, pts[i].z-pts[i-1].z);
    cum.push(L);
  }
  return {pts:pts, cum:cum, total:L||1e-6};
}
function lutAt(lut, s){        /* 弧长 → 点 + 段方向 */
  var pts=lut.pts, cum=lut.cum;
  s=Math.max(0, Math.min(lut.total, s));
  for(var i=1;i<cum.length;i++){
    if(cum[i]>=s){
      var a=pts[i-1], b=pts[i], seg=cum[i]-cum[i-1]||1e-6, w=(s-cum[i-1])/seg;
      return {x:a.x+(b.x-a.x)*w, y:a.y+(b.y-a.y)*w, z:a.z+(b.z-a.z)*w,
              dx:b.x-a.x, dz:b.z-a.z};
    }
  }
  var e=pts[pts.length-1];
  return {x:e.x, y:e.y, z:e.z, dx:1, dz:0};
}
function nearestCurveU(curve, p){
  var best=0, bd=1e9;
  for(var i=0;i<=100;i++){
    var u=i/100, q=curve.getPoint(u);
    var d=(q.x-p.x)*(q.x-p.x)+(q.z-p.z)*(q.z-p.z);
    if(d<bd){ bd=d; best=u; }
  }
  return best;
}
function startVoyage(toIs){
  if(!walkOn || !walkIsle || voyage || !toIs || toIs===walkIsle) return;
  var fromIs=walkIsle, hbf=harborOf(fromIs);
  if(!hbf) return;
  var curve=landingPath(fromIs).curve;
  var boardPt=curve.getPoint(0.5);
  if(Math.hypot(walker.position.x-boardPt.x, walker.position.z-boardPt.z)>0.30) return;
  var pts=sailPath(fromIs, toIs);
  if(pts.length<4) return;
  var lut=polylineLUT(pts);
  var u0=nearestCurveU(curve, walker.position);
  var zIf=isleZoom(fromIs.cfg, fromIs.shape);
  var zIt=isleZoom(toIs.cfg, toIs.shape);
  exitWalk();                                  /* 退出漫游态但保留小人登船 */
  walker.visible=true;
  closeWork(true); hideVoy();
  var p0f=landingPath(fromIs).dock;
  voyage={phase:'board', from:fromIs, to:toIs, curve:curve, lut:lut,
          t0:performance.now(), boardDur:2600, u0:u0,
          start:{x:walker.position.x, y:walker.position.y, z:walker.position.z},
          camFx:p0f.x+hbf.ex*0.12, camFz:p0f.z+hbf.ez*0.12,
          camZ:Math.max(0.14, zIf*0.55),
          sailDur:Math.max(6000, Math.min(22000, lut.total/0.33*1000)),
          sailZ:Math.min(0.50, Math.max(0.12, Math.max(zIf,zIt)*0.45)),
          revealed:false, fx:focusX, fz:focusZ, yaw:0};
  camTween=null;
  bH.textContent='乘船 · '+(ISLE_SHORT[toIs.cfg.id]||toIs.cfg.id);
  tip('航行中 · 点一下可跳过');
}
function stepVoyage(dt){
  if(!voyage) return;
  var V=voyage, now=performance.now();
  if(V.phase==='board'){
    var p=(V.hold!=null) ? V.hold : Math.min(1,(now-V.t0)/V.boardDur);
    var e=p*p*(3-2*p);
    var u=Math.max(0.02, V.u0+(0.02-V.u0)*e);
    var pt=V.curve.getPoint(u);
    var kbl=Math.min(1, p/0.30);               /* 前 30%：从自由走位置并入曲线 */
    walker.position.set(
      V.start.x+(pt.x-V.start.x)*kbl,
      V.start.y+(pt.y-V.start.y)*kbl,
      V.start.z+(pt.z-V.start.z)*kbl);
    var nxt=V.curve.getPoint(Math.min(1, u+0.02));
    walker.rotation.y=Math.atan2(nxt.x-pt.x, nxt.z-pt.z);
    var gait=Math.min(1, Math.abs(V.u0-u)*26);
    var sw=Math.sin(now*0.014)*0.42*gait;
    legL.rotation.x=sw; legR.rotation.x=-sw;
    armL.rotation.x=-sw*1.30; armR.rotation.x=sw*1.30;
    /* 镜头滑向码头，看小人上船 */
    var kc=Math.min(1, dt*2.2);
    focusX+=(V.camFx-focusX)*kc; focusZ+=(V.camFz-focusZ)*kc;
    zoom+=(V.camZ-zoom)*Math.min(1, dt*1.8);
    phi+=(0.94-phi)*Math.min(1, dt*1.8);
    lookY+=(0.0-lookY)*kc;
    if(p>=1){
      V.phase='sail'; V.t0=now;
      V.fx=boat.position.x; V.fz=boat.position.z; V.yaw=boat.rotation.y;
      legL.rotation.x=0; legR.rotation.x=0;
      armL.rotation.x=0; armR.rotation.x=0;
    }
  } else {
    var sp=(V.hold!=null) ? V.hold : Math.min(1,(now-V.t0)/V.sailDur);
    var q=sp<0.5 ? 2*sp*sp : 1-2*(1-sp)*(1-sp);        /* 起航/进港各缓一端 */
    var st=lutAt(V.lut, q*V.lut.total);
    boat.position.set(st.x, ROUTE_Y+0.018+Math.sin(now*0.0017)*0.004, st.z);
    var ty=Math.atan2(st.dx, st.dz)-Math.PI/2;         /* 船头=本地+x → bow=(cosY,-sinY) */
    var dyw=((ty-V.yaw+Math.PI*3)%(Math.PI*2))-Math.PI;
    V.yaw+=dyw*Math.min(1, dt*6);
    boat.rotation.y=V.yaw;
    boat.rotation.z=Math.sin(now*0.00125)*0.028;
    boatWake.material.opacity=0.30;
    /* 小人站船尾（船头本地 +x → 正面朝船头需 +π/2） */
    var co=Math.cos(V.yaw), si=Math.sin(V.yaw);
    walker.position.set(boat.position.x-co*0.10, boat.position.y+0.026, boat.position.z+si*0.10);
    walker.rotation.y=V.yaw+Math.PI/2;
    /* 镜头拉远跟船，theta 留给用户 */
    var kf=Math.min(1, dt*2.8);
    V.fx+=(st.x-V.fx)*kf; V.fz+=(st.z-V.fz)*kf;
    focusX=V.fx; focusZ=V.fz;
    zoom+=(V.sailZ-zoom)*Math.min(1, dt*1.4);
    phi+=(1.04-phi)*Math.min(1, dt*1.4);
    lookY+=(0.0-lookY)*Math.min(1, dt*2);
    if(sp>0.5 && !V.revealed){                 /* 半程渐显目标岛 */
      V.revealed=true;
      for(var i2=0;i2<isles.length;i2++)
        isles[i2].grp.visible=(isles[i2]===V.from||isles[i2]===V.to);
    }
    if(sp>=1){

/* ============ 相机 ============
   相机距离只由「群岛取景」决定，进岛靠 zoom 缩放表达。
   这样模式切换不会因为 baseRadius 突变而跳一下 */
var THETA0 = 0.04, PHI_ARCH = 0.668, PHI_ISLE = 0.705;
var theta = THETA0, phi = PHI_ARCH, zoom = 1, baseRadius = 16;
var focusX = 0, focusZ = 0, lookY = null;

function archFitW(){ return camera.aspect < 0.9 ? 11.9 : 12.4; }
function archFitH(){ return camera.aspect < 0.9 ? 10.2 : 10.0; }
function defaultLookY(){ return 0.0; }

function fitCamera(){
  var aspect = camera.aspect || 1;
  var hv = camera.fov*Math.PI/360;
  var hh = Math.atan(Math.tan(hv)*aspect);
  var fit = Math.max(archFitH()/(2*Math.tan(hv)), archFitW()/(2*Math.tan(hh)));
  /* 窄屏留边给「标签」和圆弧外扩的海床：1.00 会让最外侧岛贴死画面边缘 */
  var margin = aspect < 0.75 ? 1.08 : (aspect < 1.15 ? 1.01 : 1.03);
  baseRadius = fit * margin;
  // 雾跟着基准距离缩放：竖屏要退到 47 单位，写死 26/50 会把群岛整个埋掉
  // 0.86/1.80 是「近岛不雾、远岛雾掉 6 成」的比例：原来 1.16/2.45 比相机距离还远，
  // 等于全场无雾 → 远近一样清晰，读不出纵深，海面那圈方形边缘也就露出来了
  if(scene.fog){
    scene.fog.near = baseRadius*0.86;
    scene.fog.far  = baseRadius*1.80;
  }
}
/* 进岛的目标 zoom：沿用单岛版的比例（宽 1.21 / 高 1.10 倍），
   算出来是一段相机距离，再除以群岛的基准距离换成 zoom */
function isleZoom(cfg, shape){
  var aspect = camera.aspect || 1;
  var hv = camera.fov*Math.PI/360;
  var hh = Math.atan(Math.tan(hv)*aspect);
  var fw = shape.sx*2*1.30, fh = shape.sz*2*1.16;
  var fit = Math.max(fh/(2*Math.tan(hv)), fw/(2*Math.tan(hh)));
  return Math.min(1, fit/baseRadius);
}
function updateCamera(){
  var r = baseRadius*zoom;
  camera.position.set(focusX + r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi),
                      focusZ + r*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(focusX, lookY === null ? defaultLookY() : lookY, focusZ);
  camera.updateMatrixWorld(true);
}

/* ---- 缓动 ---- */
var SNAP = location.search.indexOf('snap=1') >= 0;
if(SNAP) document.documentElement.classList.add('snap');
var camTween = null;
function easeTo(tp, tt, tz, fx, fz, dur, ly){
  var curLY = (lookY === null ? defaultLookY() : lookY);
  camTween = {t0: performance.now(), dur: SNAP ? 1 : (dur || 560),
    a:{th:theta, ph:phi, z:zoom, fx:focusX, fz:focusZ, ly:curLY},
    b:{th:tt, ph:tp, z:tz,
       fx:(fx === undefined ? focusX : fx), fz:(fz === undefined ? focusZ : fz),
       ly:(ly === undefined ? curLY : ly)}};
  // SNAP 下直接落终态：截图环境里 enterIsle 之后可能一帧都不剩，
  // 只把 dur 设成 1 是不够的 —— 缓动压根没机会跑
  if(SNAP){
    var B = camTween.b;
    theta = B.th; phi = B.ph; zoom = B.z;
    focusX = B.fx; focusZ = B.fz; lookY = B.ly;
    camTween = null;
    updateCamera();
    renderer.render(scene, camera);   // 截图环境里 rAF 可能已停，补一次重绘
  }
}
function stepTween(){
  if(!camTween) return;
  var k = Math.min(1, (performance.now()-camTween.t0)/camTween.dur);
  var e = 1-Math.pow(1-k, 3);
  var A = camTween.a, B = camTween.b;
  theta = A.th + (B.th-A.th)*e;
  phi   = A.ph + (B.ph-A.ph)*e;
  zoom  = A.z  + (B.z -A.z )*e;
  focusX = A.fx + (B.fx-A.fx)*e;
  focusZ = A.fz + (B.fz-A.fz)*e;
  lookY  = A.ly + (B.ly-A.ly)*e;
  if(k >= 1) camTween = null;
}

/* ============ 模式：群岛 / 单岛 ============ */
/* snap 是截图模式，"构图可复现"是它的全部意义 —— 但这行之前写死 autoSpin=true，
   每帧 theta 都在涨，而无头环境下 rAF 帧数又不定，于是同一张 URL 每次出图角度都不同，
   改前改后的对比根本对不齐（P0~P2 的对比图都吃过这个亏）。 */
var MODE = 'arch', curIsle = null, autoSpin = !SNAP;

/* 进岛就只留这一座：邻近岛会从视野边缘挤进来，把「你在一座岛上」的
   空间感打碎。hide 掉以后镜头怎么转都是孤岛，正好是单岛版的味道 */
function showOnly(is){
  for(var i=0;i<isles.length;i++) isles[i].grp.visible = (is === null || isles[i] === is);
}
/* 小件只在岛内显示：总览时它们不到一个像素，纯属浪费 */
function setDetail(on){
  for(var i=0;i<isles.length;i++){
    var d = isles[i].cfg.detail;
    if(!d) continue;
    var show = on && (isles[i] === curIsle);
    for(var j=0;j<d.length;j++) d[j].visible = show;
  }
}
function enterIsle(id, instant){
  var is = null;
  for(var i=0;i<isles.length;i++) if(isles[i].cfg.id === id) is = isles[i];
  if(!is) return;
  curIsle = is;
  MODE = 'isle';
  closeWork(true);
  var z = isleZoom(is.cfg, is.shape);
  var dur = instant || SNAP ? 1 : 900;
  easeTo(PHI_ISLE, theta, z, is.x, is.z, dur, -0.02);
  if(instant || SNAP) showOnly(is);
  else setTimeout(function(){ if(curIsle === is) showOnly(is); }, 560);
  setDetail(true);
  backBtn.hidden = false;
  bK.textContent = 'ISLE · 0' + (isles.indexOf(is)+1) + ' / 07';
  bH.textContent = WORKS[id] ? WORKS[id].title : id;

}

  if(walkOn) exitWalk(); else if(walker) walker.visible=false;
  MODE = 'arch';
  curIsle = null;
  closeWork(true);
  var dur = instant || SNAP ? 1 : 900;
  easeTo(PHI_ARCH, theta, 1, 0, 0, dur, 0);

var ray = new THREE.Raycaster();
var ndc = new THREE.Vector2();
function pick(clientX, clientY){
  if(landSeq){ finishLanding(); return true; }   /* 过场中任意点击 = 跳过 */
  if(voyage){                                    /* 航程中点击 = 跳过 */
    voyage.t0 = performance.now() - (voyage.phase==='sail' ? voyage.sailDur : voyage.boardDur);
    return true;
  }
  if(walkOn){
    /* 自由走：点地面 = 走过去；点海/别处不动 */
    if(walkIsle){
      var rect = renderer.domElement.getBoundingClientRect();
      ndc.x = ((clientX-rect.left)/rect.width)*2-1;
      ndc.y = -((clientY-rect.top)/rect.height)*2+1;
      ray.setFromCamera(ndc, camera);
      var wh = ray.intersectObjects(allLand, false);
      for(var wi3=0; wi3<wh.length; wi3++){
        var wo=wh[wi3].object.userData||{};
        if(wo.isleId===walkIsle.cfg.id){
          setWalkTarget(wh[wi3].point.x, wh[wi3].point.z);
          break;
        }
      }
    }
    return true;
  }
  var rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((clientX-rect.left)/rect.width)*2-1;
  ndc.y = -((clientY-rect.top)/rect.height)*2+1;
  ray.setFromCamera(ndc, camera);

  if(MODE === 'arch'){
    var hits = ray.intersectObjects(allLand.concat(allLm), false);
    if(hits.length){
      var hid = hits[0].object.userData && hits[0].object.userData.isleId;
      if(hid){ startLanding(isleById(hid)); return true; }
    }
    return false;
  }
  // 单岛：只认当前岛的地标，别把隔壁岛点进来
  if(curIsle){
    var h2 = ray.intersectObject(curIsle.lm, false);
    if(h2.length){ openWork(curIsle.cfg.id); return true; }
  }
  return false;
}

/* ============ 拖动 / 缩放 ============ */
var pointers = {}, dragging = false, lastX = 0, lastY = 0, moved = 0, lastPinch = 0, zoomStart = 1;
renderer.domElement.addEventListener('pointerdown', function(e){
  try{ window.focus(); }catch(_e){}     /* 焦点自愈：iframe 里键盘事件常因没焦点而丢失 */
  pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
  var keys = Object.keys(pointers);
  if(keys.length === 1){ dragging = true; lastX = e.clientX; lastY = e.clientY; moved = 0; }
  if(keys.length >= 2){
    var k = keys.map(function(id){return pointers[id];});
    lastPinch = Math.hypot(k[0].x-k[1].x, k[0].y-k[1].y);
    zoomStart = walkOn ? wZoomT : zoom;
    if(voyage) lastPinch = 0;              /* 航程中镜头由状态机驱动，双指不抢 */
  }
  renderer.domElement.setPointerCapture && renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', function(e){
  if(!pointers[e.pointerId]) return;
  pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
  var keys = Object.keys(pointers);
  if(keys.length >= 2){
    var k = keys.map(function(id){return pointers[id];});
    var d = Math.hypot(k[0].x-k[1].x, k[0].y-k[1].y);
    if(lastPinch > 0 && d > 0){
      if(walkOn && walkIsle){    /* 自由走：双指调的是跟随镜头目标半径 */
        var zl=isleZoom(walkIsle.cfg,walkIsle.shape);
        wZoomT = Math.max(zl*0.14, Math.min(zl*0.52, zoomStart*lastPinch/d));
      } else {
        zoom = Math.max(zoomMin(), Math.min(1.6, zoomStart*lastPinch/d));
      }
    }
    return;
  }
  if(!dragging) return;
  var dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx)+Math.abs(dy);
  if(walkOn){                    /* 自由走：拖拽=环绕小人，仰角是目标值交给平滑器 */
    theta -= dx*0.006;
    wPhiT = Math.max(0.55, Math.min(1.30, wPhiT - dy*0.004));
    return;
  }
  theta -= dx*0.006;
  phi = Math.max(0.30, Math.min(1.40, phi - dy*0.005));
});
function endPointer(e){
  delete pointers[e.pointerId];
  if(Object.keys(pointers).length === 0) dragging = false;
  lastPinch = 0;
}
function zoomMin(){
  if(walkOn && walkIsle) return isleZoom(walkIsle.cfg, walkIsle.shape)*0.14;
  return MODE === 'isle' && curIsle ? isleZoom(curIsle.cfg, curIsle.shape)*0.55 : 0.62;
}
renderer.domElement.addEventListener('pointerup', function(e){
  endPointer(e);
  if(moved > 8) return;
  pick(e.clientX, e.clientY);
});
renderer.domElement.addEventListener('pointercancel', endPointer);
renderer.domElement.addEventListener('wheel', function(e){
  e.preventDefault();
  if(voyage) return;             /* 航程中镜头由状态机驱动 */
  if(walkOn && walkIsle){        /* 自由走：滚轮调跟随镜头目标半径 */
    var zl=isleZoom(walkIsle.cfg,walkIsle.shape);
    wZoomT = Math.max(zl*0.14, Math.min(zl*0.52, wZoomT*(1+e.deltaY*0.0011)));
    return;
  }
  zoom = Math.max(zoomMin(), Math.min(1.6, zoom*(1+e.deltaY*0.0011)));
}, {passive:false});

function nearestTheta(target){
  var best = target, bestD = Math.abs(target-theta);
  for(var k=-2;k<=2;k++){
    var cand = target + k*TAU, d = Math.abs(cand-theta);
    if(d < bestD){ bestD = d; best = cand; }
  }
  return best;
}

var nightOn = false;
var tintMats = [];
(function collectTints(){
  scene.traverse(function(o){
    if(!o.isMesh && !o.isPoints && !o.isSprite) return;
    var ms = Array.isArray(o.material) ? o.material : [o.material];
    for(var i=0;i<ms.length;i++){
      var m = ms[i];
      if(!m || !m.color || m.userData.__tinted) continue;
      m.userData.__tinted = true;
      m.userData.__base = m.color.clone();
      tintMats.push(m);

/* 天空换档：天穹的三个色 + 太阳/月亮方位 + 地平线暖光强度，
   海面的菲涅尔反射引用的是同一份 uniform，所以会跟着一起换 */
function applySky(which){
  var c = SKY_C[which], f = SKY_CFG[which];
  SKY_U.uTop.value.copy(c.top);
  SKY_U.uMid.value.copy(c.mid);
  SKY_U.uHor.value.copy(c.hor);
  SKY_U.uGlow.value.copy(c.glow);
  SKY_U.uGlowAmt.value = f.glowAmt;
}
function setNight(on){
  nightOn = on;
  stage.classList.toggle('night', on);
  document.getElementById('light').classList.toggle('on', on);
  if(on){
    applySky('night');
    setKeyDir(MOON_DIR);                                 /* 月光从画面右上那一侧来 */
    SKY_U.uSunDir.value.copy(MOON_DIR);
    SKY_U.uSunAmt.value = 0.55;                          /* 天穹上那一小片月晕 */
    key.color.setHex(0xb9cfff);  key.intensity = 1.12;
    hemi.color.setHex(0x456ab0); hemi.groundColor.setHex(0x0c1226); hemi.intensity = 0.36;
    fill.color.setHex(0x8fb6ff); fill.intensity = 0.20;
    tintScene(true);
    sea.material.color.copy(SEA_BASE).multiplyScalar(0.44);   /* 再压一档，海才真的"入夜" */
    for(var sm=0; sm<shelfMats.length; sm++) shelfMats[sm].opacity = 0.16;
    cloudMat.emissiveIntensity = 0.05;
    ROUTE_MAT.uniforms.uColor.value.setHex(0x9fe3ff);   /* 夜里航线像浮标灯 */
    scene.fog.color.setHex(0x2b4272);                   /* 对齐夜空渐变中下部，远处海面融进夜幕 */
    for(var li2=0; li2<LAMP_LIGHTS.length; li2++){
      LAMP_LIGHTS[li2].visible = true;
      LAMP_LIGHTS[li2].intensity = LAMP_INT;
    }
    for(var gi=0; gi<WATER_GLOWS.length; gi++) WATER_GLOWS[gi].visible = true;
    WATER_GLOW_MAT.uniforms.uA.value = 1.10;
  } else {
    applySky('day');
    setKeyDir(DAY_DIR);
    SKY_U.uSunDir.value.copy(DAY_DIR);
    SKY_U.uSunAmt.value = 0.0;
    key.color.setHex(0xfff4e2);  key.intensity = 1.16;      /* 与 P3 日光配置保持一致 */
    hemi.color.setHex(0xc9e4ff); hemi.groundColor.setHex(0x9dbb78); hemi.intensity = 0.28;
    fill.color.setHex(0x9ecbff); fill.intensity = 0.08;
    tintScene(false);
    sea.material.color.copy(SEA_BASE);
    for(var sm2=0; sm2<shelfMats.length; sm2++) shelfMats[sm2].opacity = 1.0;    cloudMat.emissiveIntensity = 0.42;
    ROUTE_MAT.uniforms.uColor.value.setHex(0xf0ffff);
    scene.fog.color.setHex(0xd6ecf6);
    for(var li3=0; li3<LAMP_LIGHTS.length; li3++){
      LAMP_LIGHTS[li3].intensity = 0;
      LAMP_LIGHTS[li3].visible = false;
    }
    for(var gi2=0; gi2<WATER_GLOWS.length; gi2++) WATER_GLOWS[gi2].visible = false;
  }
  settleFx();
}

/* ============ 星空 ============ */
function paintStars(){
  if(!starsCtx) return;
  var w = starsCv.clientWidth || stage.clientWidth;
  var h = starsCv.clientHeight || stage.clientHeight;
  if(!w || !h) return;
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  starsCv.width  = Math.round(w*dpr);
  starsCv.height = Math.round(h*dpr);
  var g = starsCtx;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  var r = mulberry32(31415);
  g.save();
  g.translate(w*0.46, h*0.22);
  g.rotate(-0.30);
  g.scale(1, 0.22);
  var mrad = Math.max(w,h)*0.72;
  var mg = g.createRadialGradient(0,0,0,0,0,mrad);
  mg.addColorStop(0,   'rgba(182,203,255,0.16)');
  mg.addColorStop(0.46,'rgba(150,176,240,0.075)');
  mg.addColorStop(1,   'rgba(140,168,235,0)');
  g.fillStyle = mg;
  g.beginPath(); g.arc(0,0,mrad,0,TAU); g.fill();
  g.restore();

  var n = Math.max(120, Math.min(520, Math.round(w*h/2100)));
  for(var i=0;i<n;i++){
    var x = r()*w;
    var y = Math.pow(r(), 1.45)*h*0.96;
    var q = r();
    var rad = q > 0.985 ? 1.7 + r()*0.8 : (q > 0.90 ? 1.05 : 0.50 + r()*0.42);
    var a   = q > 0.90  ? 0.70 + r()*0.30 : 0.22 + r()*0.42;
    var col = q > 0.93 ? '206,226,255' : (q > 0.80 ? '255,246,228' : '232,240,255');
    if(q > 0.985){
      var gg = g.createRadialGradient(x,y,0,x,y,rad*6);
      gg.addColorStop(0,'rgba('+col+',0.40)');
      gg.addColorStop(1,'rgba('+col+',0)');
      g.fillStyle = gg;
      g.beginPath(); g.arc(x,y,rad*6,0,TAU); g.fill();
    }
    g.beginPath();
    g.arc(x, y, rad, 0, TAU);
    g.fillStyle = 'rgba('+col+','+a.toFixed(3)+')';
    g.fill();
  }
}

/* ============ 标签定位 ============ */
var _labV = new THREE.Vector3();
function updateLabels(){
  var W = stage.clientWidth, H = stage.clientHeight;
  for(var i=0;i<isles.length;i++){
    var is = isles[i];
    var show = (MODE === 'arch');
    var el = is.lab;
    if(!show){ el.classList.remove('on'); continue; }
    _labV.set(is.x, 0.98, is.z);
    _labV.project(camera);
    // 转到相机背后就藏起来，否则会翻到画面另一侧
    if(_labV.z > 1 || _labV.x < -1.4 || _labV.x > 1.4 || _labV.y < -1.4 || _labV.y > 1.4){
      el.classList.remove('on');
      continue;
    }
    var px = (_labV.x*0.5+0.5)*W, py = (-_labV.y*0.5+0.5)*H;
    /* 标签横向不出框：贴边时往内推（窄屏尤其容易切掉半截字） */
    var lw = el.offsetWidth || 96, half = lw*0.5 + 8;
    if(px < half) px = half;
    if(px > W-half) px = W-half;
    if(py < 16) py = 16;
    if(py > H-16) py = H-16;
    el.style.transform = 'translate(-50%,-50%) translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px)';
    el.classList.add('on');
  }
}

/* ============ 渲染循环 ============ */
var clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  /* 截图 / 海报模式把动画时间锁成定值：构图可复现，&t= 可挑小船的位置 */
  var t = (HERO || SNAP) ? qNum('t', 12) : clock.getElapsedTime();
  var dt = (HERO || SNAP || lastT===null || t<=lastT) ? 0.016 : Math.min(0.05, t-lastT);
  lastT=t;
  stepTween();
  if(autoSpin && !dragging && !camTween) theta += (MODE === 'arch' ? 0.00075 : 0.0010);
  stepLanding();          /* 上岸镜轨每帧覆写相机，必须在 autoSpin 之后 */
  stepWalk(dt);           /* 自由走：同样覆写相机焦点，须在 updateCamera 之前 */
  stepVoyage(dt);         /* 跨岛乘船：登船/航行/到港的状态机 */
  updateCamera();
  /* 天穹跟着相机走（永远在球心），海面的浪用同一个时间轴 */
  skyDome.position.copy(camera.position);
  SEA_U.uTime.value = t;
  updateLabels();
  // 云慢慢往上飘一点，别完全静止
  for(var ci2=0; ci2<cloudList.length; ci2++){
    var cl = cloudList[ci2];
    cl.position.y += Math.sin(t*0.22 + cl.userData.ph)*0.00012;
  }

  // 萤火虫
  var fo = fireflies.mat.opacity;
  if(nightOn || fo > 0.012){
    fireflies.mat.opacity = fo + ((nightOn?0.92:0) - fo)*0.05;
    var arr = fireflies.attr.array, bs = fireflies.base;
    for(var i=0;i<fireflies.N;i++){
      var p = fireflies.ph[i];
      arr[i*3]   = bs[i*3]   + Math.sin(t*0.52 + p)*0.022;
      arr[i*3+1] = bs[i*3+1] + Math.sin(t*0.81 + p*1.7)*0.026;
      arr[i*3+2] = bs[i*3+2] + Math.cos(t*0.60 + p*1.3)*0.022;
    }
    fireflies.attr.needsUpdate = true;
  }
  lampGlow.mat.opacity += ((nightOn ? 0.88 : 0) - lampGlow.mat.opacity) * 0.055;

  // 圆环呼吸：群岛总览时小一点淡一点，进岛后才明显
  DOT_MAT.opacity = (nightOn ? 0.86 : 0.52) + Math.sin(t*1.9)*0.06;
  var ds = MODE === 'arch' ? 0.085 : 0.105;
  for(var w2=0; w2<isles.length; w2++){
    isles[w2].dot.scale.setScalar(ds + Math.sin(t*1.9 + w2*0.7)*0.006);
  }

  // 风车
  for(var wi2=0; wi2<isles.length; wi2++){
    if(isles[wi2].cfg.blades) isles[wi2].cfg.blades.rotation.z = t*0.5;
  }

  // 潮线呼吸
  var breathe = 0.62 + Math.sin(t*1.1)*0.12;
  var foamK = MODE === 'arch' ? 0.26 : 1.0;      // 总览七圈白边一起亮会抢过岛本身
  for(var fi=0; fi<isles.length; fi++){
    isles[fi].foamIn.material.opacity = breathe*foamK;
    isles[fi].foamOut.material.opacity = (0.24 + Math.sin(t*0.9+1.2)*0.08)*foamK;
  }

  /* ---- 航线 / 小船 / 每岛微动效 ---- */
  /* 上岸序列 / 上岸后单岛：航线网收掉，只留一艘停在码头的小船 */
  routeGroup.visible = ROUTE_ON && ((MODE === 'arch') || !!landHarbor);
  if(routeDash) routeDash.visible = (MODE === 'arch');
  if(boat){
    if(voyage){                  /* 航程中船由 stepVoyage 驱动，这里不抢 */
      boatWake.material.opacity = 0.30;
    } else if(landHarbor){
      var dk=landHarbor.dock;
      boat.position.set(dk.x+landHarbor.ex*0.11, ROUTE_Y+0.020, dk.z+landHarbor.ez*0.11);
      boat.rotation.y = -Math.atan2(-landHarbor.ez, -landHarbor.ex);
      boat.rotation.z = Math.sin(t*1.25)*0.030;
      boatWake.material.opacity = 0.12;
    } else {
      var bp2 = routeAt(t*0.0075);
      boat.position.set(bp2.x, ROUTE_Y + 0.018 + Math.sin(t*1.7)*0.004, bp2.z);
      boat.rotation.y = -Math.atan2(bp2.dz, bp2.dx);
      boat.rotation.z = Math.sin(t*1.25)*0.045;
      boatWake.material.opacity = 0.24 + Math.sin(t*2.2)*0.07;
    }
  }
  /* 航线流光：uTime 驱动彗尾游动（hero/snap 下 t 锁死 → 构图可复现）；昼夜缓动 */
  ROUTE_MAT.uniforms.uTime.value = t;
  ROUTE_MAT.uniforms.uOp.value     += ((nightOn ? 0.60 : 0.52) - ROUTE_MAT.uniforms.uOp.value)*0.06;
  ROUTE_MAT.uniforms.uNight.value  += ((nightOn ? 1 : 0)       - ROUTE_MAT.uniforms.uNight.value)*0.05;
  /* 码头：总览全亮；单岛模式只留当前岛的（岛的建筑，跟航线显隐规则不同） */
  for(var pi2=0; pi2<pierGroup.children.length; pi2++){
    var pc=pierGroup.children[pi2];
    pc.visible = (MODE === 'arch') || (!!curIsle && curIsle.cfg.id === pc.userData.isle);
  }
  var xf, F, base;
  /* 和潮线同一套分寸：总览七岛一起动会抢戏，进岛后各自明显 */
  var fxK = (MODE === 'arch') ? 0.70 : 1.35;
  for(xf=0; xf<fxMats.length; xf++){
    var u = fxMats[xf].userData;
    u.base += ((nightOn ? u.nightOp : u.dayOp) - u.base)*0.06;
    u.shown = Math.min(1, u.base*fxK);
  }
  for(xf=0; xf<isleFx.length; xf++){
    F = isleFx[xf];
    if(F.o) F.o.visible = (MODE === 'arch' || curIsle === F.is);
    base = F.o ? F.o.material.userData.shown : 0;
    switch(F.k){
      case 'pulse':
        F.mat.opacity = Math.min(1, ((nightOn ? 0.90 : 0.58) + Math.sin(t*1.3 + F.ph)*0.20)*fxK);
        break;
      case 'signal':
        F.o.position.y = F.by + Math.sin(t*1.15 + F.ph)*0.032;
        F.o.rotation.y = t*0.7;
        F.o.material.opacity = base*(0.72 + Math.sin(t*2.1 + F.ph)*0.28);
        break;
      case 'beam':
        F.o.rotation.y = t*0.42 + F.ph;
        F.o.material.opacity = base*(0.78 + Math.sin(t*0.9 + F.ph)*0.22);
        break;
      case 'smoke':
      case 'petals':
        var arr = F.o.geometry.getAttribute('position'), rising = (F.k === 'smoke');
        for(var q=0;q<F.n;q++){
          var ph = F.ph + q/F.n*TAU;
          var cyc = (t*(rising ? 0.18 : 0.13) + q/F.n)%1;
          if(rising){
            arr.setXYZ(q, F.bx + Math.sin(ph*1.7 + cyc*5)*0.020 + cyc*0.055,
                          F.by + cyc*0.20,
                          F.bz + Math.cos(ph + cyc*4)*0.018);
          } else {
            var ang = ph + t*0.30;
            arr.setXYZ(q, F.bx + Math.cos(ang)*(0.18 + (q%3)*0.07),
                          F.by - cyc*0.22,
                          F.bz + Math.sin(ang)*(0.16 + (q%3)*0.06));
          }
        }
        arr.needsUpdate = true;
        F.o.material.opacity = base*(rising ? 0.90 : 0.95);
        break;
      case 'ripple':
        var rc = (t*0.28 + F.ph)%1;
        F.o.scale.setScalar(0.55 + rc*2.0);
        F.o.material.opacity = base*(1-rc)*(1-rc);
        break;
      case 'lantern':
        F.mat.opacity = base;   /* shown 已含 fxK：白天 0，夜里一点暖光 */
        break;
    }
  }

  renderer.render(scene, camera);
}

  if(spinBtn) spinBtn.classList.remove('on');
  dropHint();
  /* 云在世界空间随机散布，海报机位下常只露半朵在角落；默认收掉，?cloud=1 可开 */
  if(!/[?&]cloud=1/.test(location.search)) sky.visible = false;
  lampGlow.mat.opacity  = nightOn ? 0.88 : 0;
  fireflies.mat.opacity = nightOn ? 0.92 : 0;
  /* 海报是单帧：把新动效的昼夜强度直接落终值，不等逐帧 lerp */
  for(var hfi=0; hfi<fxMats.length; hfi++){
    var hu=fxMats[hfi].userData;
    hu.base = nightOn ? hu.nightOp : hu.dayOp;
    hu.shown = Math.min(1, hu.base*(MODE === 'arch' ? 0.70 : 1.35));
  }
  ROUTE_MAT.uniforms.uTime.value     = qNum('t', 12);
  ROUTE_MAT.uniforms.uOp.value       = nightOn ? 0.60 : 0.52;
  ROUTE_MAT.uniforms.uNight.value    = nightOn ? 1 : 0;
  ROUTE_MAT.uniforms.uColor.value.setHex(nightOn ? 0x9fe3ff : 0xf0ffff);

  function heroShot(){
    camTween = null;                       // 别让任何缓动把机位拉走
    var zA = qNum('z', NaN), fxA = qNum('fx', NaN), fzA = qNum('fz', NaN);
    var inIsle = (MODE === 'isle' && curIsle);
    theta  = qNum('th', THETA0);
    phi    = qNum('ph', inIsle ? PHI_ISLE : PHI_ARCH);
    zoom   = isNaN(zA) ? (inIsle ? isleZoom(curIsle.cfg, curIsle.shape) : 1) : zA;
    focusX = isNaN(fxA) ? (inIsle ? curIsle.x : 0) : fxA;
    focusZ = isNaN(fzA) ? (inIsle ? curIsle.z : 0) : fzA;
    lookY  = qNum('ly', inIsle ? -0.02 : 0);
    updateCamera();
    renderer.render(scene, camera);
  }
  /* 等 ?isle= 直达的 enterIsle 落定后再覆盖机位 */
  setTimeout(heroShot, 180);
  window.__heroShot = heroShot;

  function exportHeroPNG(){
    renderer.render(scene, camera);       // 同帧内立刻取，绕开 drawing buffer 清空
    var cv = renderer.domElement;
    var a = document.createElement('a');
    a.download = 'archipelago_' + (nightOn ? 'night' : 'day') + '_' + cv.width + 'x' + cv.height + '.png';
    a.href = cv.toDataURL('image/png');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
  window.addEventListener('keydown', function(e){ if(e.key === 's' || e.key === 'S') exportHeroPNG(); });
  if(/[?&]save=1/.test(location.search)) setTimeout(exportHeroPNG, 520);
}

/* 出图调试：?voy=<fromId>,<toId>,<board|sail>,<0-1> 把航程直接摆到指定进度 */
(function(){
  var vm=location.search.match(/[?&]voy=([a-zA-Z]+),([a-zA-Z]+),(board|sail),([0-9.]+)/);
  if(!vm || SNAP || HERO) return;
  var vFrom=isleById(vm[1]), vTo=isleById(vm[2]);
  if(!vFrom || !vTo || !harborOf(vFrom) || !harborOf(vTo)) return;
  var vCurve=landingPath(vFrom).curve;
  var vPts=sailPath(vFrom, vTo), vLut=polylineLUT(vPts);
  var zIf=isleZoom(vFrom.cfg, vFrom.shape), zIt=isleZoom(vTo.cfg, vTo.shape);
  MODE='isle'; curIsle=vFrom;
  landHarbor=landingPath(vFrom);
  showOnly(vFrom); setDetail(true);
  backBtn.hidden=false;
  bK.textContent='ISLE · 0'+(isles.indexOf(vFrom)+1)+' / 07';
  bH.textContent='乘船 · '+(ISLE_SHORT[vTo.cfg.id]||vTo.cfg.id);
  walker.visible=true;
  walker.scale.setScalar(1.2);
  walker.position.copy(vCurve.getPoint(0.5));
  walker.position.y=groundYAt(vFrom, walker.position.x, walker.position.z);
  voyage={phase:vm[3], from:vFrom, to:vTo, curve:vCurve, lut:vLut,
          t0:performance.now(), boardDur:2600, u0:0.5,
          start:{x:walker.position.x, y:walker.position.y, z:walker.position.z},
          camFx:vFrom.x+harborOf(vFrom).ex*(harborOf(vFrom).d+0.12),
          camFz:vFrom.z+harborOf(vFrom).ez*(harborOf(vFrom).d+0.12),
          camZ:Math.max(0.14, zIf*0.55),
          sailDur:Math.max(6000, Math.min(22000, vLut.total/0.33*1000)),
          sailZ:Math.min(0.50, Math.max(0.12, Math.max(zIf,zIt)*0.45)),
          revealed:false, fx:focusX, fz:focusZ, yaw:0};
  var pr=parseFloat(vm[4]);
  voyage.hold = pr;                            /* ?voy= 冻结在指定进度（出图用） */
  if(vm[3]==='board'){
    var u=Math.max(0.02, 0.5+(0.02-0.5)*pr);
    walker.position.copy(vCurve.getPoint(u));
    var nb=vCurve.getPoint(Math.min(1,u+0.02)), pb=vCurve.getPoint(u);
    walker.rotation.y=Math.atan2(nb.x-pb.x, nb.z-pb.z);
    var vhf=harborOf(vFrom);
    theta=Math.atan2(-vhf.ex,-vhf.ez);          /* 相机从海面侧看码头 */
    var vdk=landingPath(vFrom).dock;
    boat.position.set(vdk.x+vhf.ex*0.11, ROUTE_Y+0.020, vdk.z+vhf.ez*0.11);
    boat.rotation.y=-Math.atan2(-vhf.ez,-vhf.ex);
    boat.rotation.z=0;
    focusX=voyage.camFx; focusZ=voyage.camFz;
    zoom=voyage.camZ; phi=0.94; lookY=0;
    voyage.t0=performance.now()-pr*voyage.boardDur;
  } else {
    var sp2=Math.min(1, pr), q2=sp2<0.5 ? 2*sp2*sp2 : 1-2*(1-sp2)*(1-sp2);
    var st2=lutAt(vLut, q2*vLut.total);
    boat.position.set(st2.x, ROUTE_Y+0.018, st2.z);
    boat.rotation.y=Math.atan2(st2.dx, st2.dz)-Math.PI/2;
    voyage.yaw=boat.rotation.y;
    walker.position.set(st2.x-Math.cos(boat.rotation.y)*0.10, boat.position.y+0.026,
                        st2.z+Math.sin(boat.rotation.y)*0.10);
    walker.rotation.y=boat.rotation.y+Math.PI/2;
    voyage.fx=st2.x; voyage.fz=st2.z;
    theta=Math.atan2(-Math.cos(boat.rotation.y), Math.sin(boat.rotation.y)); /* 船尾追随视角 */
    focusX=st2.x; focusZ=st2.z;
    zoom=voyage.sailZ; phi=1.04; lookY=0;
    voyage.t0=performance.now()-pr*voyage.sailDur;
    if(sp2>0.5){
      voyage.revealed=true;
      for(var iv=0;iv<isles.length;iv++)
        isles[iv].grp.visible=(isles[iv]===vFrom||isles[iv]===vTo);
    }
  }
})();

/* 出图调试：?wpose=<x>,<z>[,<rot>] —— 把小人钉到指定世界坐标与朝向。
   上岸曲线的终点经常落在树丛里（树高 0.28，小人 0.108，整个人被树冠罩住），
   想拍脸根本拍不到。这个参数直接绕过曲线，配合 ?hero=1&fx=&fz=&th= 出特写。
   th 取 rot 值即为正面机位（模型正面 = 本地 +Z）。 */
(function(){
  var m = location.search.match(/[?&]wpose=(-?[0-9.]+),(-?[0-9.]+)(?:,(-?[0-9.]+))?/);
  if(!m) return;
  setTimeout(function(){
    if(!walker) return;
    var px = parseFloat(m[1]), pz = parseFloat(m[2]), host = null;
    for(var i=0;i<isles.length;i++){
      var is = isles[i];
      var u = (px-is.x)/is.shape.sx, v = (pz-is.z)/is.shape.sz;
      if(Math.sqrt(u*u+v*v) <= Rat(is.shape, Math.atan2(v,u))*1.02){ host = is; break; }
    }
    walker.visible = true;
    walker.position.set(px, host ? groundYAt(host, px, pz) : 0.02, pz);
    walker.scale.setScalar(1.2);
    if(m[3] !== undefined) walker.rotation.y = parseFloat(m[3]);
    renderer.render(scene, camera);
  }, 420);
})();

/* ?noveg=1 把树全部收掉：给小人 / 地标出特写时，树冠会把主体整个罩住 */
if(/[?&]noveg=1/.test(location.search))
  for(var nv=0; nv<TREE_MESHES.length; nv++) TREE_MESHES[nv].visible = false;

requestAnimationFrame(function(){ animate(); });

})();
</script>
</body>
